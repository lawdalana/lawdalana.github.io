<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1060" viewBox="0 0 800 1060" role="img" aria-labelledby="title description" data-provenance="illustrative"><title id="title">RCO: protect the budget</title><desc id="description">Projection, retraction and transport are different</desc><metadata>{"scope": "conceptual illustration"}</metadata><defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172842" /></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c84b41" /></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087f78" /></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a96a0a" /></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7255b7" /></marker></defs><rect x="0" y="0" width="800" height="1060" fill="#f4f7fc" rx="24" /><text x="44" y="40" fill="#52617a" font-size="22" font-weight="700" text-anchor="start">ILLUSTRATED GUIDE  /  05</text><text x="44" y="96" fill="#172842" font-size="39" font-weight="750" text-anchor="start">RCO: protect the budget</text><text x="44" y="140" fill="#52617a" font-size="27" font-weight="400" text-anchor="start">Projection, retraction and transport are different</text><rect x="44" y="180" width="712" height="398" fill="#ffffff" rx="16" /><path d="M 100 480 Q 400 120 700 480" fill="none" stroke="#3174b9" stroke-width="5" /><text x="485" y="475" fill="#3174b9" font-size="32" font-weight="650" text-anchor="start">C(α) = B</text><line x1="170" y1="393" x2="430" y2="237" stroke="#52617a" stroke-width="3" stroke-dasharray="7 6" /><line x1="250" y1="345" x2="345" y2="200" stroke="#c84b41" stroke-width="3" marker-end="url(#arrow-coral)" /><text x="365" y="215" fill="#c84b41" font-size="26" font-weight="400" text-anchor="start">raw update</text><line x1="250" y1="345" x2="370" y2="273" stroke="#087f78" stroke-width="3" marker-end="url(#arrow-teal)" /><text x="152" y="275" fill="#087f78" font-size="31" font-weight="750" text-anchor="start">1</text><line x1="370" y1="273" x2="370" y2="301.8" stroke="#a96a0a" stroke-width="3" marker-end="url(#arrow-amber)" /><text x="405" y="294" fill="#a96a0a" font-size="31" font-weight="750" text-anchor="start">2</text><line x1="370" y1="301.8" x2="500" y2="286.2" stroke="#7255b7" stroke-width="3" marker-end="url(#arrow-violet)" /><text x="510" y="292" fill="#7255b7" font-size="31" font-weight="750" text-anchor="start">3</text><circle cx="250" cy="345" r="8" fill="#3174b9" /><circle cx="370" cy="301.8" r="8" fill="#3174b9" /><text x="203" y="383" fill="#3174b9" font-size="31" font-weight="650" text-anchor="start">α</text><text x="345" y="356" fill="#3174b9" font-size="28" font-weight="650" text-anchor="start">α new</text><text x="400" y="540" fill="#52617a" font-size="25" font-weight="400" text-anchor="middle">Schematic curve, not literal high-dimensional logits</text><rect x="44" y="610" width="712" height="106" fill="#ffffff" rx="14" /><circle cx="86" cy="656" r="24" fill="#087f78" /><text x="86" y="666" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">1</text><text x="130" y="649" fill="#087f78" font-size="31" font-weight="700" text-anchor="start">Project</text><text x="130" y="690" fill="#52617a" font-size="24" font-weight="400" text-anchor="start">Remove the normal part of the gradient</text><rect x="44" y="738" width="712" height="106" fill="#ffffff" rx="14" /><circle cx="86" cy="784" r="24" fill="#a96a0a" /><text x="86" y="794" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">2</text><text x="130" y="777" fill="#a96a0a" font-size="31" font-weight="700" text-anchor="start">Retract</text><text x="130" y="818" fill="#52617a" font-size="24" font-weight="400" text-anchor="start">Restore the budget along the cost-shift direction</text><rect x="44" y="866" width="712" height="106" fill="#ffffff" rx="14" /><circle cx="86" cy="912" r="24" fill="#7255b7" /><text x="86" y="922" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">3</text><text x="130" y="905" fill="#7255b7" font-size="31" font-weight="700" text-anchor="start">Transport</text><text x="130" y="946" fill="#52617a" font-size="24" font-weight="400" text-anchor="start">Align Adam’s first moment to the new tangent</text><text x="400" y="1034" fill="#52617a" font-size="24" font-weight="400" text-anchor="middle">Expected budget here; constrained DP handles hard choices</text></svg>
