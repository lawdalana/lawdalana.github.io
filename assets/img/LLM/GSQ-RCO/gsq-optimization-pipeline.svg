<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120" role="img" aria-labelledby="title description" data-provenance="illustrative"><title id="title">GSQ: training → export</title><desc id="description">Learning the assignment is an offline step</desc><metadata>{"scope": "conceptual illustration"}</metadata><defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172842" /></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c84b41" /></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087f78" /></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a96a0a" /></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7255b7" /></marker></defs><rect x="0" y="0" width="800" height="1120" fill="#f4f7fc" rx="24" /><text x="44" y="40" fill="#52617a" font-size="22" font-weight="700" text-anchor="start">ILLUSTRATED GUIDE  /  02</text><text x="44" y="96" fill="#172842" font-size="39" font-weight="750" text-anchor="start">GSQ: training → export</text><text x="44" y="140" fill="#52617a" font-size="27" font-weight="400" text-anchor="start">Learning the assignment is an offline step</text><rect x="44" y="186" width="712" height="126" fill="#ffffff" rx="16" /><circle cx="89" cy="239" r="26" fill="#3174b9" /><text x="89" y="249" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">1</text><text x="134" y="234" fill="#3174b9" font-size="32" font-weight="700" text-anchor="start">Pretrained + calibration</text><text x="134" y="277" fill="#52617a" font-size="25" font-weight="400" text-anchor="start">Collect reference outputs for reconstruction</text><line x1="400" y1="316" x2="400" y2="337" stroke="#172842" stroke-width="3" marker-end="url(#arrow-ink)" /><rect x="44" y="350" width="712" height="126" fill="#ffffff" rx="16" /><circle cx="89" cy="403" r="26" fill="#3174b9" /><text x="89" y="413" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">2</text><text x="134" y="398" fill="#3174b9" font-size="32" font-weight="700" text-anchor="start">GPTQ warm start</text><text x="134" y="441" fill="#52617a" font-size="25" font-weight="400" text-anchor="start">Initial integer codes + group scales</text><line x1="400" y1="480" x2="400" y2="501" stroke="#172842" stroke-width="3" marker-end="url(#arrow-ink)" /><rect x="44" y="514" width="712" height="126" fill="#ffffff" rx="16" /><circle cx="89" cy="567" r="26" fill="#7255b7" /><text x="89" y="577" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">3</text><text x="134" y="562" fill="#7255b7" font-size="32" font-weight="700" text-anchor="start">Learn logits + scales</text><text x="134" y="605" fill="#52617a" font-size="25" font-weight="400" text-anchor="start">Backpropagate through soft Gumbel choices</text><line x1="400" y1="644" x2="400" y2="665" stroke="#172842" stroke-width="3" marker-end="url(#arrow-ink)" /><rect x="44" y="678" width="712" height="126" fill="#ffffff" rx="16" /><circle cx="89" cy="731" r="26" fill="#7255b7" /><text x="89" y="741" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">4</text><text x="134" y="726" fill="#7255b7" font-size="32" font-weight="700" text-anchor="start">Anneal + check hard loss</text><text x="134" y="769" fill="#52617a" font-size="25" font-weight="400" text-anchor="start">Sharper choices; verify the actual grid values</text><line x1="400" y1="808" x2="400" y2="829" stroke="#172842" stroke-width="3" marker-end="url(#arrow-ink)" /><rect x="44" y="842" width="712" height="126" fill="#ffffff" rx="16" /><circle cx="89" cy="895" r="26" fill="#087f78" /><text x="89" y="905" fill="#ffffff" font-size="29" font-weight="700" text-anchor="middle">5</text><text x="134" y="890" fill="#087f78" font-size="32" font-weight="700" text-anchor="start">Freeze, pack and verify</text><text x="134" y="933" fill="#52617a" font-size="25" font-weight="400" text-anchor="start">Hard codes + scales become the checkpoint</text><rect x="44" y="1034" width="712" height="54" fill="#e1f2ef" rx="12" /><text x="400" y="1070" fill="#087f78" font-size="27" font-weight="600" text-anchor="middle">Inference: no sampling or auxiliary logits</text></svg>
