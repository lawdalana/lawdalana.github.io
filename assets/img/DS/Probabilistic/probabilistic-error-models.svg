<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Four error models in approximate data structures</title>
  <desc id="desc">Four panels contrast one-sided errors in Bloom filter and Count-Min Sketch, sampling variation in HyperLogLog and MinHash, bounded candidate summaries in Space-Saving, and relative value error in DDSketch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0a1628"/><stop offset="1" stop-color="#111a31"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".04"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity=".42"/></filter><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <style>text{font-family:Inter,"Noto Sans Thai","Segoe UI",Arial,sans-serif}.title{font-size:44px;font-weight:850;letter-spacing:1.4px;fill:#f8fafc}.subtitle{font-size:20px;fill:#9fb1c8}.cardTitle{font-size:27px;font-weight:850;fill:#f8fafc}.tag{font-size:13px;font-weight:900;letter-spacing:1.7px}.label{font-size:16px;font-weight:750;fill:#e5eef8}.small{font-size:14px;font-weight:550;fill:#9fb2c8}.formula{font-size:20px;font-weight:800}.footer{font-size:16px;font-weight:650;fill:#a9bbcf}</style>
  </defs>
  <rect width="1600" height="1040" fill="url(#bg)"/><rect width="1600" height="1040" fill="url(#grid)"/>
  <g transform="translate(80 50)"><rect y="5" width="9" height="58" rx="4.5" fill="#fb7185"/><text x="28" y="43" class="title">“ACCURACY” MEANS FOUR DIFFERENT THINGS</text><text x="29" y="76" class="subtitle">Do not write one generic percentage in an SLA — name the direction, probability, and unit of error.</text></g>

  <g transform="translate(80 155)" filter="url(#shadow)"><rect width="700" height="350" rx="24" fill="#12243a" stroke="#2b759a"/><text x="26" y="40" class="tag" fill="#7dd3fc">ONE-SIDED ERROR</text><text x="26" y="76" class="cardTitle">Bloom Filter + Count-Min Sketch</text><path d="M26 95H674" stroke="#294761"/>
    <g transform="translate(34 126)"><text x="0" y="18" class="label">Bloom</text><rect x="94" width="198" height="40" rx="12" fill="#0c4a6e"/><text x="193" y="26" text-anchor="middle" class="label" fill="#bae6fd">NO = definitive</text><rect x="308" width="214" height="40" rx="12" fill="#164e63"/><text x="415" y="26" text-anchor="middle" class="label" fill="#bae6fd">YES = maybe</text><text x="0" y="77" class="label">CMS</text><line x1="94" y1="68" x2="578" y2="68" stroke="#64748b" stroke-width="3"/><circle cx="300" cy="68" r="10" fill="#f8fafc"/><circle cx="426" cy="68" r="10" fill="#f59e0b"/><text x="300" y="98" text-anchor="middle" class="small">true f(x)</text><text x="426" y="98" text-anchor="middle" class="small" fill="#fcd34d">estimate ≥ true</text></g>
    <rect x="26" y="242" width="648" height="88" rx="15" fill="#0c1c2e" stroke="#24445e"/><text x="48" y="270" class="formula" fill="#7dd3fc">Direction matters.</text><text x="48" y="296" class="small">Bloom collisions add false positives; CMS collisions add counts</text><text x="48" y="318" class="small">in the standard nonnegative-update model.</text></g>

  <g transform="translate(820 155)" filter="url(#shadow)"><rect width="700" height="350" rx="24" fill="#1a2339" stroke="#6468b1"/><text x="26" y="40" class="tag" fill="#a5b4fc">SAMPLING VARIATION</text><text x="26" y="76" class="cardTitle">HyperLogLog + MinHash</text><path d="M26 95H674" stroke="#39415d"/>
    <g transform="translate(50 126)"><path d="M0 112H600" stroke="#64748b" stroke-width="2"/><path d="M35 112C130 110 150 98 194 58C234 20 268 4 300 4C332 4 366 20 406 58C450 98 470 110 565 112Z" fill="#6366f1" opacity=".25"/><path d="M35 112C130 110 150 98 194 58C234 20 268 4 300 4C332 4 366 20 406 58C450 98 470 110 565 112" fill="none" stroke="#818cf8" stroke-width="4"/><line x1="300" y1="0" x2="300" y2="132" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="6 6"/><text x="300" y="157" text-anchor="middle" class="label">true value</text><text x="96" y="145" text-anchor="middle" class="small">lower estimate</text><text x="504" y="145" text-anchor="middle" class="small">higher estimate</text></g>
    <rect x="26" y="292" width="648" height="42" rx="13" fill="#111a32" stroke="#393d69"/><text x="350" y="319" text-anchor="middle" class="small">More registers/signature positions → a narrower estimator distribution.</text></g>

  <g transform="translate(80 545)" filter="url(#shadow)"><rect width="700" height="350" rx="24" fill="#202238" stroke="#7657aa"/><text x="26" y="40" class="tag" fill="#c4b5fd">BOUNDED CANDIDATE SUMMARY</text><text x="26" y="76" class="cardTitle">Space-Saving</text><path d="M26 95H674" stroke="#49415f"/>
    <g transform="translate(42 126)"><text x="0" y="17" class="small">full stream frequencies</text><rect x="0" y="35" width="76" height="112" rx="9" fill="#7c3aed"/><rect x="88" y="61" width="76" height="86" rx="9" fill="#8b5cf6"/><rect x="176" y="84" width="76" height="63" rx="9" fill="#a78bfa"/><rect x="264" y="111" width="76" height="36" rx="9" fill="#55436f"/><rect x="352" y="121" width="76" height="26" rx="9" fill="#443653"/><rect x="440" y="129" width="76" height="18" rx="9" fill="#382f44"/><text x="38" y="170" text-anchor="middle" class="small">A</text><text x="126" y="170" text-anchor="middle" class="small">B</text><text x="214" y="170" text-anchor="middle" class="small">C</text><text x="302" y="170" text-anchor="middle" class="small">D</text><text x="390" y="170" text-anchor="middle" class="small">E</text><text x="478" y="170" text-anchor="middle" class="small">F</text><path d="M-6 153H258" stroke="#c4b5fd" stroke-width="3"/><text x="557" y="80" class="label" fill="#ddd6fe">k slots</text><text x="557" y="106" class="small">retain likely</text><text x="557" y="128" class="small">heavy hitters</text></g>
    <text x="42" y="327" class="small">The output is a candidate list with count bounds — not a full frequency table and not always exact Top-K ordering.</text></g>

  <g transform="translate(820 545)" filter="url(#shadow)"><rect width="700" height="350" rx="24" fill="#202333" stroke="#a94b64"/><text x="26" y="40" class="tag" fill="#fda4af">RELATIVE VALUE ERROR</text><text x="26" y="76" class="cardTitle">DDSketch</text><path d="M26 95H674" stroke="#533746"/>
    <g transform="translate(40 128)"><line x1="0" y1="108" x2="610" y2="108" stroke="#64748b" stroke-width="3"/><line x1="90" y1="94" x2="90" y2="122" stroke="#94a3b8" stroke-width="2"/><line x1="300" y1="88" x2="300" y2="128" stroke="#f8fafc" stroke-width="3"/><line x1="510" y1="94" x2="510" y2="122" stroke="#94a3b8" stroke-width="2"/><rect x="230" y="39" width="140" height="48" rx="15" fill="#881337"/><text x="300" y="69" text-anchor="middle" class="formula" fill="#fecdd3">true q = v</text><path d="M230 97V86M370 97V86" stroke="#fb7185" stroke-width="3"/><path d="M230 92H370" stroke="#fb7185" stroke-width="4"/><text x="90" y="151" text-anchor="middle" class="small">small values</text><text x="300" y="151" text-anchor="middle" class="small">estimate in v × (1 ± α)</text><text x="510" y="151" text-anchor="middle" class="small">large values</text></g>
    <rect x="26" y="292" width="648" height="42" rx="13" fill="#211825" stroke="#5d3748"/><text x="350" y="319" text-anchor="middle" class="small">The absolute interval scales with the quantile value; this suits wide latency ranges.</text></g>

  <g transform="translate(80 936)"><rect width="1440" height="66" rx="17" fill="#111f34" stroke="#2d415b"/><circle cx="30" cy="33" r="7" fill="#f59e0b"/><text x="52" y="28" class="footer">Before production, write the error in a sentence: “what can be wrong, in which direction, by how much, and with what probability?”</text><text x="52" y="52" class="small">Then validate that contract with exact samples drawn from the real workload.</text></g>
</svg>
