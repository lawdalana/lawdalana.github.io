<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Six approximate data structure families</title>
  <desc id="desc">Six cards map common questions to Bloom filter, HyperLogLog, Count-Min Sketch, MinHash, Space-Saving, and DDSketch, including the compact state, answer, and main error model of each structure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0b1628"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".04"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="11" stdDeviation="15" flood-color="#000814" flood-opacity=".42"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <style>
      text{font-family:Inter,"Noto Sans Thai","Segoe UI",Arial,sans-serif}.title{font-size:44px;font-weight:850;letter-spacing:1.5px;fill:#f8fafc}.subtitle{font-size:20px;fill:#9fb1c8}.cardTitle{font-size:28px;font-weight:850;fill:#f8fafc}.category{font-size:13px;font-weight:850;letter-spacing:2px}.question{font-size:21px;font-weight:750;fill:#e8f2fc}.label{font-size:13px;font-weight:850;letter-spacing:1.4px;fill:#71869f}.value{font-size:18px;font-weight:700;fill:#dce8f5}.note{font-size:15px;font-weight:550;fill:#9fb2c8}.number{font-size:16px;font-weight:900;fill:#07111f}.footer{font-size:16px;font-weight:650;fill:#9fb1c8}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/><rect width="1600" height="1080" fill="url(#grid)"/>
  <circle cx="1470" cy="85" r="190" fill="#8b5cf6" opacity=".06" filter="url(#glow)"/><circle cx="90" cy="1000" r="180" fill="#0ea5e9" opacity=".055" filter="url(#glow)"/>
  <g transform="translate(80 54)"><rect y="5" width="9" height="58" rx="4.5" fill="#a78bfa"/><text x="28" y="43" class="title">SIX QUESTIONS, SIX COMPACT SUMMARIES</text><text x="29" y="76" class="subtitle">Start with the query you need — each structure has a different answer and a different failure mode.</text></g>

  <g transform="translate(80 165)" filter="url(#shadow)"><rect width="450" height="370" rx="24" fill="#10253b" stroke="#2680a8" stroke-width="1.5"/><rect x="24" y="24" width="38" height="38" rx="11" fill="#38bdf8"/><text x="43" y="50" text-anchor="middle" class="number">1</text><text x="80" y="42" class="category" fill="#7dd3fc">MEMBERSHIP</text><text x="80" y="72" class="cardTitle">Bloom Filter</text><text x="24" y="116" class="question">“Have we seen x?”</text><path d="M24 140H426" stroke="#264762"/>
    <text x="24" y="171" class="label">COMPACT STATE</text><text x="24" y="199" class="value">bit array + k hash positions</text><text x="24" y="238" class="label">QUERY RETURNS</text><rect x="24" y="253" width="176" height="44" rx="12" fill="#0c4a6e"/><text x="112" y="281" text-anchor="middle" class="value" fill="#bae6fd">NO / MAYBE</text><text x="24" y="329" class="note">NO is definitive; MAYBE can be a false positive.</text><circle cx="408" cy="276" r="18" fill="#164e63" stroke="#38bdf8"/><path d="M399 276l6 6 12-15" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>

  <g transform="translate(575 165)" filter="url(#shadow)"><rect width="450" height="370" rx="24" fill="#17243a" stroke="#5b65bd" stroke-width="1.5"/><rect x="24" y="24" width="38" height="38" rx="11" fill="#818cf8"/><text x="43" y="50" text-anchor="middle" class="number">2</text><text x="80" y="42" class="category" fill="#a5b4fc">DISTINCT COUNT</text><text x="80" y="72" class="cardTitle">HyperLogLog</text><text x="24" y="116" class="question">“How many unique values?”</text><path d="M24 140H426" stroke="#35415f"/>
    <text x="24" y="171" class="label">COMPACT STATE</text><text x="24" y="199" class="value">small max-rank registers</text><text x="24" y="238" class="label">QUERY RETURNS</text><rect x="24" y="253" width="176" height="44" rx="12" fill="#312e81"/><text x="112" y="281" text-anchor="middle" class="value" fill="#c7d2fe">ESTIMATE N</text><text x="24" y="329" class="note">Statistical error shrinks as register count grows.</text><g transform="translate(337 250)"><rect width="18" height="47" rx="5" fill="#3730a3"/><rect x="24" y="19" width="18" height="28" rx="5" fill="#4f46e5"/><rect x="48" y="8" width="18" height="39" rx="5" fill="#6366f1"/><rect x="72" y="25" width="18" height="22" rx="5" fill="#818cf8"/></g></g>

  <g transform="translate(1070 165)" filter="url(#shadow)"><rect width="450" height="370" rx="24" fill="#1d2536" stroke="#a56c25" stroke-width="1.5"/><rect x="24" y="24" width="38" height="38" rx="11" fill="#f59e0b"/><text x="43" y="50" text-anchor="middle" class="number">3</text><text x="80" y="42" class="category" fill="#fcd34d">POINT FREQUENCY</text><text x="80" y="72" class="cardTitle">Count-Min Sketch</text><text x="24" y="116" class="question">“How often did x occur?”</text><path d="M24 140H426" stroke="#4f402b"/>
    <text x="24" y="171" class="label">COMPACT STATE</text><text x="24" y="199" class="value">d × w counter matrix</text><text x="24" y="238" class="label">QUERY RETURNS</text><rect x="24" y="253" width="176" height="44" rx="12" fill="#713f12"/><text x="112" y="281" text-anchor="middle" class="value" fill="#fde68a">EST. COUNT(x)</text><text x="24" y="329" class="note">Collisions cause one-sided overcount in the standard model.</text><g transform="translate(345 251)" fill="#f59e0b"><rect width="18" height="18" rx="4"/><rect x="24" width="18" height="18" rx="4" opacity=".45"/><rect x="48" width="18" height="18" rx="4" opacity=".7"/><rect y="24" width="18" height="18" rx="4" opacity=".55"/><rect x="24" y="24" width="18" height="18" rx="4"/><rect x="48" y="24" width="18" height="18" rx="4" opacity=".35"/></g></g>

  <g transform="translate(80 575)" filter="url(#shadow)"><rect width="450" height="370" rx="24" fill="#17263a" stroke="#248e82" stroke-width="1.5"/><rect x="24" y="24" width="38" height="38" rx="11" fill="#2dd4bf"/><text x="43" y="50" text-anchor="middle" class="number">4</text><text x="80" y="42" class="category" fill="#5eead4">SET SIMILARITY</text><text x="80" y="72" class="cardTitle">MinHash</text><text x="24" y="116" class="question">“How similar are A and B?”</text><path d="M24 140H426" stroke="#294c4c"/>
    <text x="24" y="171" class="label">COMPACT STATE</text><text x="24" y="199" class="value">k minimum-hash signature values</text><text x="24" y="238" class="label">QUERY RETURNS</text><rect x="24" y="253" width="176" height="44" rx="12" fill="#134e4a"/><text x="112" y="281" text-anchor="middle" class="value" fill="#99f6e4">EST. JACCARD</text><text x="24" y="329" class="note">More signature positions reduce sampling variance.</text><g transform="translate(342 259)"><circle cx="26" cy="18" r="22" fill="#0f766e" opacity=".8"/><circle cx="51" cy="18" r="22" fill="#14b8a6" opacity=".6"/><path d="M31 18h15" stroke="#ccfbf1" stroke-width="3"/></g></g>

  <g transform="translate(575 575)" filter="url(#shadow)"><rect width="450" height="370" rx="24" fill="#202238" stroke="#7b5bb5" stroke-width="1.5"/><rect x="24" y="24" width="38" height="38" rx="11" fill="#a78bfa"/><text x="43" y="50" text-anchor="middle" class="number">5</text><text x="80" y="42" class="category" fill="#c4b5fd">HEAVY HITTERS</text><text x="80" y="72" class="cardTitle">Space-Saving</text><text x="24" y="116" class="question">“Which items lead the stream?”</text><path d="M24 140H426" stroke="#47405f"/>
    <text x="24" y="171" class="label">COMPACT STATE</text><text x="24" y="199" class="value">k tracked item/counter entries</text><text x="24" y="238" class="label">QUERY RETURNS</text><rect x="24" y="253" width="176" height="44" rx="12" fill="#4c1d95"/><text x="112" y="281" text-anchor="middle" class="value" fill="#ddd6fe">CANDIDATE TOP-K</text><text x="24" y="329" class="note">Minimum entry is replaced; tracked counts may overestimate.</text><g transform="translate(342 250)"><rect y="34" width="20" height="46" rx="5" fill="#7c3aed"/><rect x="28" y="17" width="20" height="63" rx="5" fill="#8b5cf6"/><rect x="56" width="20" height="80" rx="5" fill="#a78bfa"/></g></g>

  <g transform="translate(1070 575)" filter="url(#shadow)"><rect width="450" height="370" rx="24" fill="#202434" stroke="#b24d68" stroke-width="1.5"/><rect x="24" y="24" width="38" height="38" rx="11" fill="#fb7185"/><text x="43" y="50" text-anchor="middle" class="number">6</text><text x="80" y="42" class="category" fill="#fda4af">QUANTILES</text><text x="80" y="72" class="cardTitle">DDSketch</text><text x="24" y="116" class="question">“What are p50, p95, p99?”</text><path d="M24 140H426" stroke="#523848"/>
    <text x="24" y="171" class="label">COMPACT STATE</text><text x="24" y="199" class="value">logarithmic value buckets</text><text x="24" y="238" class="label">QUERY RETURNS</text><rect x="24" y="253" width="176" height="44" rx="12" fill="#881337"/><text x="112" y="281" text-anchor="middle" class="value" fill="#fecdd3">EST. QUANTILE</text><text x="24" y="329" class="note">Guarantee is relative to value, not a universal rank error.</text><path d="M338 292C360 285 365 260 382 266s20-24 45-20" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/></g>

  <g transform="translate(80 994)"><rect width="1440" height="52" rx="16" fill="#111f34" stroke="#2d415b"/><circle cx="28" cy="26" r="6" fill="#34d399"/><text x="48" y="32" class="footer">These structures do not share one universal “accuracy %”. Choose by query contract, error model, and merge compatibility.</text></g>
</svg>
