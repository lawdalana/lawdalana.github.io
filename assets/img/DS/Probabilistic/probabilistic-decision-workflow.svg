<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Decision workflow for approximate data structures</title>
  <desc id="desc">A query-first selection workflow routes Boolean membership, distinct count, point frequency, set similarity, top-k candidates, and quantile questions to Bloom filter, HyperLogLog, Count-Min Sketch, MinHash, Space-Saving, and DDSketch. Final gates require an error contract, compatible merge configuration, and exact validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0a1628"/><stop offset="1" stop-color="#111a31"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".04"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity=".42"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#94a3b8"/></marker>
    <style>text{font-family:Inter,"Noto Sans Thai","Segoe UI",Arial,sans-serif}.title{font-size:44px;font-weight:850;letter-spacing:1.4px;fill:#f8fafc}.subtitle{font-size:20px;fill:#9fb1c8}.start{font-size:24px;font-weight:850;fill:#f8fafc}.type{font-size:13px;font-weight:900;letter-spacing:1.8px}.question{font-size:19px;font-weight:750;fill:#edf4fb}.choice{font-size:25px;font-weight:850;fill:#f8fafc}.small{font-size:14px;font-weight:550;fill:#9fb2c8}.gate{font-size:17px;font-weight:800;fill:#e7eff8}.tiny{font-size:13px;font-weight:650;fill:#91a6bd}</style>
  </defs>
  <rect width="1600" height="1050" fill="url(#bg)"/><rect width="1600" height="1050" fill="url(#grid)"/>
  <g transform="translate(80 50)"><rect y="5" width="9" height="58" rx="4.5" fill="#34d399"/><text x="28" y="43" class="title">CHOOSE FROM THE QUERY, NOT THE HYPE</text><text x="29" y="76" class="subtitle">First define what the caller needs back; only then choose state, error budget, and merge rules.</text></g>
  <g transform="translate(460 145)" filter="url(#shadow)"><rect width="680" height="112" rx="24" fill="#13243a" stroke="#3d5c78" stroke-width="1.5"/><text x="340" y="39" text-anchor="middle" class="start">What must one query return?</text><text x="340" y="69" text-anchor="middle" class="small">If the answer must be exact, auditable, or individually recoverable,</text><text x="340" y="91" text-anchor="middle" class="small">keep exact state or verify via a source of truth.</text></g>
  <path d="M800 257V302M304 302H1296M304 302V340M800 302V340M1296 302V340" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <g transform="translate(90 340)" filter="url(#shadow)"><rect width="430" height="210" rx="22" fill="#10253b" stroke="#2780a8"/><text x="24" y="35" class="type" fill="#7dd3fc">BOOLEAN MEMBERSHIP</text><text x="24" y="72" class="question">“Was x seen before?”</text><path d="M24 94H406" stroke="#294861"/><text x="24" y="133" class="choice">Bloom Filter</text><text x="24" y="164" class="small">Use when false positives are acceptable.</text><text x="24" y="187" class="small">Need deletion? Evaluate a deletion-capable variant.</text></g>
  <g transform="translate(585 340)" filter="url(#shadow)"><rect width="430" height="210" rx="22" fill="#1c2435" stroke="#9b6728"/><text x="24" y="35" class="type" fill="#fcd34d">POINT FREQUENCY</text><text x="24" y="72" class="question">“How many times did x occur?”</text><path d="M24 94H406" stroke="#4d402d"/><text x="24" y="133" class="choice">Count-Min Sketch</text><text x="24" y="164" class="small">Good for known keys under positive updates.</text><text x="24" y="187" class="small">Keep a separate candidate source for Top-K.</text></g>
  <g transform="translate(1080 340)" filter="url(#shadow)"><rect width="430" height="210" rx="22" fill="#202238" stroke="#7657aa"/><text x="24" y="35" class="type" fill="#c4b5fd">RANKED CANDIDATES</text><text x="24" y="72" class="question">“Which items are frequent?”</text><path d="M24 94H406" stroke="#49415f"/><text x="24" y="133" class="choice">Space-Saving</text><text x="24" y="164" class="small">Tracks only a bounded candidate set.</text><text x="24" y="187" class="small">Oversize k when ordering near the cutoff matters.</text></g>

  <path d="M304 551V590M800 551V590M1296 551V590" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(90 600)" filter="url(#shadow)"><rect width="430" height="210" rx="22" fill="#17233a" stroke="#6067b7"/><text x="24" y="35" class="type" fill="#a5b4fc">DISTINCT CARDINALITY</text><text x="24" y="72" class="question">“How many unique values?”</text><path d="M24 94H406" stroke="#36415d"/><text x="24" y="133" class="choice">HyperLogLog</text><text x="24" y="164" class="small">Returns a count, not the unique values.</text><text x="24" y="187" class="small">Increase register count for lower statistical error.</text></g>
  <g transform="translate(585 600)" filter="url(#shadow)"><rect width="430" height="210" rx="22" fill="#16263a" stroke="#28877d"/><text x="24" y="35" class="type" fill="#5eead4">SET RELATION</text><text x="24" y="72" class="question">“How similar are sets A and B?”</text><path d="M24 94H406" stroke="#294b4c"/><text x="24" y="133" class="choice">MinHash</text><text x="24" y="164" class="small">Approximates Jaccard similarity.</text><text x="24" y="187" class="small">Define tokens/shingles before choosing k.</text></g>
  <g transform="translate(1080 600)" filter="url(#shadow)"><rect width="430" height="210" rx="22" fill="#202333" stroke="#a94b64"/><text x="24" y="35" class="type" fill="#fda4af">DISTRIBUTION QUANTILE</text><text x="24" y="72" class="question">“What are p50, p95, p99?”</text><path d="M24 94H406" stroke="#533746"/><text x="24" y="133" class="choice">DDSketch</text><text x="24" y="164" class="small">Useful across wide value ranges.</text><text x="24" y="187" class="small">Budget relative-value error and bucket storage.</text></g>

  <text x="80" y="862" class="type" fill="#71869f">PRODUCTION GATES — ALL THREE MUST PASS</text>
  <g transform="translate(80 885)"><rect width="450" height="104" rx="19" fill="#111f34" stroke="#3b526b"/><circle cx="38" cy="36" r="15" fill="#164e63" stroke="#38bdf8"/><text x="38" y="42" text-anchor="middle" class="gate">1</text><text x="66" y="39" class="gate">Error contract is explicit</text><text x="66" y="68" class="small">FPR, additive error, variance, or relative error?</text></g>
  <g transform="translate(575 885)"><rect width="450" height="104" rx="19" fill="#111f34" stroke="#3b526b"/><circle cx="38" cy="36" r="15" fill="#4c1d95" stroke="#a78bfa"/><text x="38" y="42" text-anchor="middle" class="gate">2</text><text x="66" y="39" class="gate">State is merge-compatible</text><text x="66" y="68" class="small">Same precision, dimensions, hashes, seed, mapping.</text></g>
  <g transform="translate(1070 885)"><rect width="450" height="104" rx="19" fill="#111f34" stroke="#3b526b"/><circle cx="38" cy="36" r="15" fill="#14532d" stroke="#34d399"/><text x="38" y="42" text-anchor="middle" class="gate">3</text><text x="66" y="39" class="gate">Validated against exact samples</text><text x="66" y="68" class="small">Measure real error, saturation, and cutoff instability.</text></g>
  <text x="800" y="1028" text-anchor="middle" class="tiny">Approximation is an engineering contract: question → state → error → validation → fallback.</text>
</svg>
