<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">How six approximate summaries work</title>
  <desc id="desc">Six compact mechanism diagrams show Bloom filter bit probes, HyperLogLog registers, Count-Min Sketch counter rows, MinHash signature comparison, Space-Saving candidate replacement, and DDSketch logarithmic buckets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".52" stop-color="#0a1628"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".04"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity=".4"/></filter>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#38bdf8"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#a78bfa"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#f59e0b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#2dd4bf"/></marker><marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#fb7185"/></marker>
    <style>text{font-family:Inter,"Noto Sans Thai","Segoe UI",Arial,sans-serif}.title{font-size:44px;font-weight:850;letter-spacing:1.4px;fill:#f8fafc}.subtitle{font-size:20px;fill:#9fb1c8}.cardTitle{font-size:25px;font-weight:850;fill:#f8fafc}.step{font-size:16px;font-weight:750;fill:#e5eef8}.small{font-size:14px;font-weight:550;fill:#9fb2c8}.tiny{font-size:13px;font-weight:650;fill:#8399b2}.result{font-size:17px;font-weight:850}.badge{font-size:12px;font-weight:900;letter-spacing:1.5px}</style>
  </defs>
  <rect width="1600" height="1280" fill="url(#bg)"/><rect width="1600" height="1280" fill="url(#grid)"/>
  <g transform="translate(80 52)"><rect y="5" width="9" height="58" rx="4.5" fill="#38bdf8"/><text x="28" y="43" class="title">HOW THE SIX SUMMARIES COMPRESS A STREAM</text><text x="29" y="76" class="subtitle">Different state, different query, different error — “approximate” is not one mechanism.</text></g>

  <g transform="translate(80 155)" filter="url(#shadow)"><rect width="700" height="300" rx="24" fill="#10243a" stroke="#277da3"/><text x="26" y="42" class="cardTitle">1 · BLOOM FILTER</text><text x="674" y="40" text-anchor="end" class="badge" fill="#7dd3fc">HASH → BITS</text><path d="M26 59H674" stroke="#294761"/>
    <rect x="26" y="88" width="106" height="58" rx="14" fill="#0c4a6e"/><text x="79" y="123" text-anchor="middle" class="step">item x</text><path d="M141 117H207" stroke="#38bdf8" stroke-width="3" marker-end="url(#blue)"/><g transform="translate(220 78)"><rect width="78" height="34" rx="10" fill="#123755"/><rect y="44" width="78" height="34" rx="10" fill="#123755"/><rect y="88" width="78" height="34" rx="10" fill="#123755"/><text x="39" y="23" text-anchor="middle" class="small">h₁(x)</text><text x="39" y="67" text-anchor="middle" class="small">h₂(x)</text><text x="39" y="111" text-anchor="middle" class="small">h₃(x)</text></g><path d="M310 117H360" stroke="#38bdf8" stroke-width="3" marker-end="url(#blue)"/>
    <g transform="translate(374 91)"><rect width="38" height="44" rx="7" fill="#193047"/><rect x="44" width="38" height="44" rx="7" fill="#0ea5e9"/><rect x="88" width="38" height="44" rx="7" fill="#193047"/><rect x="132" width="38" height="44" rx="7" fill="#0ea5e9"/><rect x="176" width="38" height="44" rx="7" fill="#0ea5e9"/><rect x="220" width="38" height="44" rx="7" fill="#193047"/><g fill="#e0f2fe" font-size="17" font-weight="800"><text x="19" y="29" text-anchor="middle">0</text><text x="63" y="29" text-anchor="middle">1</text><text x="107" y="29" text-anchor="middle">0</text><text x="151" y="29" text-anchor="middle">1</text><text x="195" y="29" text-anchor="middle">1</text><text x="239" y="29" text-anchor="middle">0</text></g></g>
    <rect x="26" y="204" width="648" height="66" rx="15" fill="#0c1c2e" stroke="#24445e"/><text x="48" y="231" class="result" fill="#7dd3fc">QUERY:</text><text x="126" y="231" class="step">any probed bit = 0 → definitely absent</text><text x="126" y="255" class="small">all bits = 1 → maybe present; collisions can create false positives</text></g>

  <g transform="translate(820 155)" filter="url(#shadow)"><rect width="700" height="300" rx="24" fill="#17233a" stroke="#6067b7"/><text x="26" y="42" class="cardTitle">2 · HYPERLOGLOG</text><text x="674" y="40" text-anchor="end" class="badge" fill="#a5b4fc">HASH → REGISTER MAX</text><path d="M26 59H674" stroke="#36415d"/>
    <rect x="26" y="90" width="112" height="58" rx="14" fill="#312e81"/><text x="82" y="125" text-anchor="middle" class="step">hash(x)</text><path d="M150 119H206" stroke="#a78bfa" stroke-width="3" marker-end="url(#violet)"/><rect x="220" y="79" width="150" height="80" rx="14" fill="#202749" stroke="#5957a6"/><text x="295" y="108" text-anchor="middle" class="step">index j</text><text x="295" y="134" text-anchor="middle" class="small">remaining bits → ρ</text><path d="M383 119H431" stroke="#a78bfa" stroke-width="3" marker-end="url(#violet)"/>
    <g transform="translate(445 84)"><rect width="40" height="64" rx="8" fill="#3730a3"/><rect x="47" y="18" width="40" height="46" rx="8" fill="#4f46e5"/><rect x="94" y="7" width="40" height="57" rx="8" fill="#6366f1"/><rect x="141" y="27" width="40" height="37" rx="8" fill="#818cf8"/><rect x="188" y="12" width="40" height="52" rx="8" fill="#4f46e5"/><text x="114" y="88" text-anchor="middle" class="tiny">M[j] = max(M[j], ρ)</text></g>
    <rect x="26" y="204" width="648" height="66" rx="15" fill="#111a32" stroke="#363b68"/><text x="48" y="231" class="result" fill="#a5b4fc">QUERY:</text><text x="126" y="231" class="step">combine all register values into a cardinality estimate</text><text x="126" y="255" class="small">rare long zero-runs are evidence that many distinct hashes were observed</text></g>

  <g transform="translate(80 490)" filter="url(#shadow)"><rect width="700" height="300" rx="24" fill="#1b2435" stroke="#9c6727"/><text x="26" y="42" class="cardTitle">3 · COUNT-MIN SKETCH</text><text x="674" y="40" text-anchor="end" class="badge" fill="#fcd34d">HASH → COUNTERS → MIN</text><path d="M26 59H674" stroke="#4c402d"/>
    <rect x="26" y="91" width="106" height="58" rx="14" fill="#713f12"/><text x="79" y="126" text-anchor="middle" class="step">item x</text><path d="M143 120H195" stroke="#f59e0b" stroke-width="3" marker-end="url(#orange)"/>
    <g transform="translate(210 78)"><g fill="#312b25" stroke="#79582e"><rect width="48" height="32" rx="6"/><rect x="55" width="48" height="32" rx="6"/><rect x="110" width="48" height="32" rx="6" fill="#8a5311"/><rect x="165" width="48" height="32" rx="6"/><rect y="43" width="48" height="32" rx="6"/><rect x="55" y="43" width="48" height="32" rx="6" fill="#8a5311"/><rect x="110" y="43" width="48" height="32" rx="6"/><rect x="165" y="43" width="48" height="32" rx="6"/><rect y="86" width="48" height="32" rx="6" fill="#8a5311"/><rect x="55" y="86" width="48" height="32" rx="6"/><rect x="110" y="86" width="48" height="32" rx="6"/><rect x="165" y="86" width="48" height="32" rx="6"/></g><g class="small" fill="#fde68a"><text x="134" y="22" text-anchor="middle">9</text><text x="79" y="65" text-anchor="middle">7</text><text x="24" y="108" text-anchor="middle">8</text></g></g><path d="M440 120H493" stroke="#f59e0b" stroke-width="3" marker-end="url(#orange)"/><rect x="508" y="87" width="166" height="66" rx="14" fill="#57330f"/><text x="591" y="114" text-anchor="middle" class="tiny" fill="#fcd34d">MIN(9, 7, 8)</text><text x="591" y="139" text-anchor="middle" class="result" fill="#fde68a">estimate = 7</text>
    <rect x="26" y="204" width="648" height="66" rx="15" fill="#1b1b24" stroke="#59462d"/><text x="48" y="231" class="result" fill="#fcd34d">UPDATE:</text><text x="137" y="231" class="step">increment one counter in every row</text><text x="137" y="255" class="small">CMS answers count(x), but it cannot enumerate candidate keys by itself</text></g>

  <g transform="translate(820 490)" filter="url(#shadow)"><rect width="700" height="300" rx="24" fill="#16263a" stroke="#28877d"/><text x="26" y="42" class="cardTitle">4 · MINHASH</text><text x="674" y="40" text-anchor="end" class="badge" fill="#5eead4">SETS → SIGNATURE MATCHES</text><path d="M26 59H674" stroke="#294b4c"/>
    <g transform="translate(26 78)"><circle cx="54" cy="42" r="40" fill="#0f766e" opacity=".8"/><circle cx="93" cy="42" r="40" fill="#14b8a6" opacity=".62"/><text x="73" y="47" text-anchor="middle" class="step">A ∩ B</text></g><path d="M153 120H202" stroke="#2dd4bf" stroke-width="3" marker-end="url(#teal)"/>
    <g transform="translate(217 80)"><text x="0" y="20" class="tiny">sig(A)</text><text x="0" y="59" class="tiny">sig(B)</text><g transform="translate(66)"><rect width="46" height="30" rx="7" fill="#0f766e"/><rect x="52" width="46" height="30" rx="7" fill="#0f766e"/><rect x="104" width="46" height="30" rx="7" fill="#0f766e"/><rect x="156" width="46" height="30" rx="7" fill="#134e4a"/><rect y="39" width="46" height="30" rx="7" fill="#0f766e"/><rect x="52" y="39" width="46" height="30" rx="7" fill="#0f766e"/><rect x="104" y="39" width="46" height="30" rx="7" fill="#0f766e"/><rect x="156" y="39" width="46" height="30" rx="7" fill="#36514c"/><g class="small" fill="#ccfbf1"><text x="23" y="21" text-anchor="middle">1</text><text x="75" y="21" text-anchor="middle">4</text><text x="127" y="21" text-anchor="middle">2</text><text x="179" y="21" text-anchor="middle">7</text><text x="23" y="60" text-anchor="middle">1</text><text x="75" y="60" text-anchor="middle">4</text><text x="127" y="60" text-anchor="middle">2</text><text x="179" y="60" text-anchor="middle">9</text></g></g></g><path d="M501 120H544" stroke="#2dd4bf" stroke-width="3" marker-end="url(#teal)"/><rect x="558" y="88" width="116" height="64" rx="14" fill="#134e4a"/><text x="616" y="115" text-anchor="middle" class="tiny" fill="#99f6e4">3 / 4 match</text><text x="616" y="139" text-anchor="middle" class="result" fill="#ccfbf1">J ≈ .75</text>
    <rect x="26" y="204" width="648" height="66" rx="15" fill="#0f202e" stroke="#28534f"/><text x="48" y="231" class="result" fill="#5eead4">QUERY:</text><text x="126" y="231" class="step">matching signature positions ÷ signature length</text><text x="126" y="255" class="small">tokenization and shingling define what “similar” means before hashing</text></g>

  <g transform="translate(80 825)" filter="url(#shadow)"><rect width="700" height="300" rx="24" fill="#202238" stroke="#7657aa"/><text x="26" y="42" class="cardTitle">5 · SPACE-SAVING</text><text x="674" y="40" text-anchor="end" class="badge" fill="#c4b5fd">TRACK → REPLACE MINIMUM</text><path d="M26 59H674" stroke="#49415f"/>
    <rect x="26" y="91" width="106" height="58" rx="14" fill="#4c1d95"/><text x="79" y="126" text-anchor="middle" class="step">new D</text><path d="M143 120H198" stroke="#a78bfa" stroke-width="3" marker-end="url(#violet)"/>
    <g transform="translate(213 78)"><rect width="110" height="42" rx="10" fill="#3b2a64"/><rect y="48" width="110" height="42" rx="10" fill="#493078"/><rect y="96" width="110" height="42" rx="10" fill="#5b3590"/><text x="18" y="27" class="small" fill="#ddd6fe">C</text><text x="92" y="27" text-anchor="end" class="step">2</text><text x="18" y="75" class="small" fill="#ddd6fe">B</text><text x="92" y="75" text-anchor="end" class="step">4</text><text x="18" y="123" class="small" fill="#ddd6fe">A</text><text x="92" y="123" text-anchor="end" class="step">8</text></g><path d="M340 120H397" stroke="#a78bfa" stroke-width="3" marker-end="url(#violet)"/>
    <g transform="translate(412 78)"><rect width="110" height="42" rx="10" fill="#6332a3" stroke="#a78bfa"/><rect y="48" width="110" height="42" rx="10" fill="#493078"/><rect y="96" width="110" height="42" rx="10" fill="#5b3590"/><text x="18" y="27" class="small" fill="#f3e8ff">D</text><text x="92" y="27" text-anchor="end" class="step">3</text><text x="18" y="75" class="small" fill="#ddd6fe">B</text><text x="92" y="75" text-anchor="end" class="step">4</text><text x="18" y="123" class="small" fill="#ddd6fe">A</text><text x="92" y="123" text-anchor="end" class="step">8</text></g><text x="548" y="108" class="tiny" fill="#c4b5fd">replace min C:2</text><text x="548" y="132" class="step">D gets 2 + 1</text>
    <rect x="26" y="204" width="648" height="66" rx="15" fill="#171a2d" stroke="#4b4167"/><text x="48" y="231" class="result" fill="#c4b5fd">STATE:</text><text x="121" y="231" class="step">only k candidates survive</text><text x="121" y="255" class="small">basic Space-Saving is deterministic; candidate counts can inherit overcount</text></g>

  <g transform="translate(820 825)" filter="url(#shadow)"><rect width="700" height="300" rx="24" fill="#202333" stroke="#a94b64"/><text x="26" y="42" class="cardTitle">6 · DDSKETCH</text><text x="674" y="40" text-anchor="end" class="badge" fill="#fda4af">VALUE → LOG BUCKET</text><path d="M26 59H674" stroke="#533746"/>
    <rect x="26" y="91" width="106" height="58" rx="14" fill="#881337"/><text x="79" y="126" text-anchor="middle" class="step">v = 120</text><path d="M143 120H202" stroke="#fb7185" stroke-width="3" marker-end="url(#rose)"/><rect x="217" y="86" width="166" height="68" rx="14" fill="#4c1d31" stroke="#9f3a58"/><text x="300" y="113" text-anchor="middle" class="tiny" fill="#fda4af">index = ceil(logγ v)</text><text x="300" y="139" text-anchor="middle" class="step">bucket 123</text><path d="M396 120H438" stroke="#fb7185" stroke-width="3" marker-end="url(#rose)"/>
    <g transform="translate(452 80)"><rect y="65" width="34" height="53" rx="6" fill="#9f1239"/><rect x="42" y="39" width="34" height="79" rx="6" fill="#be123c"/><rect x="84" y="16" width="34" height="102" rx="6" fill="#e11d48"/><rect x="126" y="58" width="34" height="60" rx="6" fill="#fb7185"/><rect x="168" y="83" width="34" height="35" rx="6" fill="#fda4af"/><path d="M0 126H214" stroke="#64748b"/><text x="107" y="149" text-anchor="middle" class="tiny">ordered logarithmic buckets</text></g>
    <rect x="26" y="204" width="648" height="66" rx="15" fill="#211825" stroke="#5d3748"/><text x="48" y="231" class="result" fill="#fda4af">QUERY:</text><text x="126" y="231" class="step">walk cumulative counts to the target quantile</text><text x="126" y="255" class="small">bucket mapping gives a relative-value error guarantee across a wide range</text></g>

  <g transform="translate(80 1170)"><rect width="1440" height="66" rx="17" fill="#111f34" stroke="#2d415b"/><circle cx="30" cy="33" r="7" fill="#34d399"/><text x="52" y="28" class="step">Merge is an operation on compatible state, not a generic checkbox.</text><text x="52" y="51" class="small">Dimensions, precision, hash family/seed, bucket mapping, and version must agree before distributed summaries are combined.</text></g>
</svg>
