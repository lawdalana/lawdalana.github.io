<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LMDB MVCC and safe page reuse timeline</title>
  <desc id="desc">Reader A holds snapshot 42 and references old page P5. Writer 43 creates P9 and commits a new root. New Reader B sees snapshot 43, but P5 cannot be reclaimed while Reader A remains active. Reader A ending only clears its reader slot. A later writer determines that P5 is safe, records or selects it through FreeDB, and may reuse it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0a1629"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity=".42"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#94a3b8"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#38bdf8"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#f59e0b"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#34d399"/></marker>
    <style>text{font-family:Inter,"Noto Sans Thai","Segoe UI",Arial,sans-serif}.title{font-size:44px;font-weight:800;letter-spacing:1.4px;fill:#f8fafc}.subtitle{font-size:20px;fill:#9fb1c8}.eyebrow{font-size:14px;font-weight:850;letter-spacing:2px;fill:#71869f}.time{font-size:15px;font-weight:850;fill:#cbd5e1}.cardTitle{font-size:19px;font-weight:800;fill:#f2f8ff}.cardSub{font-size:14px;fill:#adbed1}.label{font-size:17px;font-weight:750;fill:#e5f3ff}.small{font-size:14px;font-weight:550;fill:#9fb2c8}.tiny{font-size:13px;font-weight:650;fill:#91a6bd}.code{font-size:14px;font-weight:750;font-family:"SFMono-Regular",Consolas,monospace;fill:#bae6fd}.banner{font-size:18px;font-weight:800;fill:#fff7ed}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/><circle cx="1450" cy="100" r="180" fill="#34d399" opacity=".055" filter="url(#glow)"/><circle cx="100" cy="900" r="190" fill="#0ea5e9" opacity=".055" filter="url(#glow)"/>
  <g transform="translate(82 58)"><rect y="4" width="9" height="58" rx="4.5" fill="#34d399"/><text x="28" y="42" class="title">LMDB MVCC &amp; PAGE REUSE</text><text x="29" y="74" class="subtitle">The oldest active reader defines when an old page becomes safe to reclaim</text></g>
  <g transform="translate(1190 57)"><rect width="327" height="44" rx="22" fill="#143229" stroke="#34765c"/><circle cx="24" cy="22" r="6" fill="#34d399"/><text x="43" y="28" class="small" fill="#c9f6df">REUSE IS WRITER-MANAGED</text></g>

  <text x="82" y="157" class="eyebrow">TIMELINE</text>
  <path d="M130 215H1492" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#0f172a" stroke="#64748b" stroke-width="3"><circle cx="154" cy="215" r="10"/><circle cx="407" cy="215" r="10"/><circle cx="660" cy="215" r="10"/><circle cx="913" cy="215" r="10"/><circle cx="1166" cy="215" r="10"/><circle cx="1419" cy="215" r="10"/></g>

  <g transform="translate(82 250)" filter="url(#shadow)"><rect width="226" height="316" rx="20" fill="#102a40" stroke="#2e779e" stroke-width="1.5"/><rect x="18" y="18" width="56" height="30" rx="15" fill="#0c4a6e"/><text x="46" y="39" text-anchor="middle" class="time">T0</text><text x="18" y="82" class="cardTitle">Reader A begins</text><text x="18" y="111" class="cardSub">Claims a reader slot</text><rect x="18" y="137" width="190" height="69" rx="14" fill="#153b55" stroke="#3b82a9"/><text x="113" y="164" text-anchor="middle" class="code">snapshot = 42</text><text x="113" y="188" text-anchor="middle" class="cardSub">root R42 → page P5</text><rect x="55" y="229" width="116" height="60" rx="14" fill="#164e75" stroke="#67e8f9"/><text x="113" y="255" text-anchor="middle" class="label">P5 · OLD</text><text x="113" y="278" text-anchor="middle" class="tiny">in active view</text></g>

  <g transform="translate(335 250)" filter="url(#shadow)"><rect width="226" height="316" rx="20" fill="#31241d" stroke="#95632e" stroke-width="1.5"/><rect x="18" y="18" width="56" height="30" rx="15" fill="#713f12"/><text x="46" y="39" text-anchor="middle" class="time" fill="#fde68a">T1</text><text x="18" y="82" class="cardTitle">Writer 43 updates</text><text x="18" y="111" class="cardSub">COW keeps P5 unchanged</text><path d="M66 163H158" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#orange)"/><rect x="18" y="137" width="74" height="60" rx="13" fill="#164e75" stroke="#67e8f9"/><text x="55" y="173" text-anchor="middle" class="label">P5</text><rect x="134" y="137" width="74" height="60" rx="13" fill="#7a491f" stroke="#fbbf24"/><text x="171" y="173" text-anchor="middle" class="label">P9</text><rect x="18" y="229" width="190" height="60" rx="14" fill="#3a2b21" stroke="#8a5d2e"/><text x="113" y="255" text-anchor="middle" class="code" fill="#fde68a">new root R43</text><text x="113" y="278" text-anchor="middle" class="tiny">not visible until commit</text></g>

  <g transform="translate(588 250)" filter="url(#shadow)"><rect width="226" height="316" rx="20" fill="#1e3029" stroke="#398361" stroke-width="1.5"/><rect x="18" y="18" width="56" height="30" rx="15" fill="#145c4a"/><text x="46" y="39" text-anchor="middle" class="time" fill="#a7f3d0">T2</text><text x="18" y="82" class="cardTitle">Writer commits 43</text><text x="18" y="111" class="cardSub">Publishes alternate meta</text><rect x="18" y="137" width="190" height="69" rx="14" fill="#143b34" stroke="#34d399"/><text x="113" y="164" text-anchor="middle" class="code" fill="#a7f3d0">latest = 43</text><text x="113" y="188" text-anchor="middle" class="cardSub">root R43 → page P9</text><rect x="18" y="229" width="190" height="60" rx="14" fill="#253129" stroke="#647a6c"/><text x="113" y="255" text-anchor="middle" class="label">P5 NOT REUSABLE</text><text x="113" y="278" text-anchor="middle" class="tiny">Reader A still holds txn 42</text></g>

  <g transform="translate(841 250)" filter="url(#shadow)"><rect width="226" height="316" rx="20" fill="#102a40" stroke="#2e779e" stroke-width="1.5"/><rect x="18" y="18" width="56" height="30" rx="15" fill="#0c4a6e"/><text x="46" y="39" text-anchor="middle" class="time">T3</text><text x="18" y="82" class="cardTitle">Reader B begins</text><text x="18" y="111" class="cardSub">Captures latest snapshot</text><rect x="18" y="137" width="190" height="69" rx="14" fill="#153b55" stroke="#3b82a9"/><text x="113" y="164" text-anchor="middle" class="code">snapshot = 43</text><text x="113" y="188" text-anchor="middle" class="cardSub">root R43 → page P9</text><rect x="18" y="229" width="190" height="60" rx="14" fill="#182d3d" stroke="#406079"/><text x="113" y="255" text-anchor="middle" class="label">OLDEST = 42</text><text x="113" y="278" text-anchor="middle" class="tiny">writer scans reader table</text></g>

  <g transform="translate(1094 250)" filter="url(#shadow)"><rect width="226" height="316" rx="20" fill="#27233a" stroke="#6959a6" stroke-width="1.5"/><rect x="18" y="18" width="56" height="30" rx="15" fill="#493b7d"/><text x="46" y="39" text-anchor="middle" class="time" fill="#ddd6fe">T4</text><text x="18" y="82" class="cardTitle">Reader A ends</text><text x="18" y="111" class="cardSub">Its slot becomes inactive</text><rect x="18" y="137" width="190" height="69" rx="14" fill="#292649" stroke="#62579a"/><text x="113" y="164" text-anchor="middle" class="code" fill="#ddd6fe">slot A = clear</text><text x="113" y="188" text-anchor="middle" class="cardSub">snapshot 42 released</text><rect x="18" y="229" width="190" height="60" rx="14" fill="#332a42" stroke="#78669d"/><text x="113" y="255" text-anchor="middle" class="label">NO FreeDB WRITE</text><text x="113" y="278" text-anchor="middle" class="tiny">reader only releases slot</text></g>

  <g transform="translate(1347 250)" filter="url(#shadow)"><rect width="171" height="316" rx="20" fill="#1f342b" stroke="#3b8b60" stroke-width="1.5"/><rect x="18" y="18" width="56" height="30" rx="15" fill="#145c4a"/><text x="46" y="39" text-anchor="middle" class="time" fill="#a7f3d0">T5</text><text x="18" y="82" class="cardTitle">Later writer</text><text x="18" y="111" class="cardSub">re-evaluates safety</text><rect x="18" y="137" width="135" height="69" rx="14" fill="#143b34" stroke="#34d399"/><text x="85" y="164" text-anchor="middle" class="code" fill="#a7f3d0">oldest ≥ 43</text><text x="85" y="188" text-anchor="middle" class="cardSub">P5 is safe</text><rect x="18" y="229" width="135" height="60" rx="14" fill="#145c4a" stroke="#6ee7b7"/><text x="85" y="255" text-anchor="middle" class="label">REUSE P5</text><text x="85" y="278" text-anchor="middle" class="tiny">via FreeDB</text></g>

  <text x="82" y="625" class="eyebrow">READER TABLE VIEW</text>
  <g transform="translate(82 648)" filter="url(#shadow)"><rect width="910" height="166" rx="21" fill="#171b35" stroke="#67599d" stroke-width="1.5"/><text x="24" y="37" class="label">lock.mdb · active reader slots</text><g transform="translate(24 58)"><rect width="270" height="78" rx="14" fill="#292649" stroke="#62579a"/><circle cx="28" cy="39" r="8" fill="#38bdf8"/><text x="50" y="32" class="code" fill="#ddd6fe">Reader A · txn 42</text><text x="50" y="56" class="tiny">active until T4</text><rect x="290" width="270" height="78" rx="14" fill="#292649" stroke="#62579a"/><circle cx="318" cy="39" r="8" fill="#38bdf8"/><text x="340" y="32" class="code" fill="#ddd6fe">Reader B · txn 43</text><text x="340" y="56" class="tiny">starts at T3</text><rect x="580" width="282" height="78" rx="14" fill="#22253a" stroke="#4c506d"/><text x="604" y="32" class="label">Writer scan</text><text x="604" y="56" class="tiny">minimum active txnid gates reuse</text></g></g>
  <g transform="translate(1028 648)" filter="url(#shadow)"><rect width="490" height="166" rx="21" fill="#153029" stroke="#3a8661" stroke-width="1.5"/><text x="24" y="37" class="label">FreeDB · writer-owned bookkeeping</text><rect x="24" y="58" width="442" height="78" rx="14" fill="#143b34" stroke="#34765c"/><text x="46" y="89" class="code" fill="#a7f3d0">key: freeing transaction ID</text><text x="46" y="116" class="code" fill="#a7f3d0">value: list of page IDs</text></g>

  <g transform="translate(82 850)"><rect width="1436" height="104" rx="20" fill="#30241d" stroke="#95632e" stroke-width="1.5"/><circle cx="42" cy="52" r="13" fill="#f59e0b"/><text x="70" y="35" class="banner">WHY LONG READERS GROW THE FILE</text><text x="70" y="62" class="small" fill="#f5dfc4">A writer cannot reuse pages that an older active snapshot may still traverse.</text><text x="70" y="84" class="small" fill="#f5dfc4">If reusable pages remain pinned, the high-water mark extends even after many deletes.</text><rect x="1192" y="27" width="214" height="50" rx="14" fill="#3b2d22" stroke="#8b6032"/><text x="1299" y="48" text-anchor="middle" class="tiny" fill="#fde6b5">READER ENDS ≠ FILE SHRINKS</text><text x="1299" y="68" text-anchor="middle" class="tiny">later writes can reuse space</text></g>
  <text x="800" y="985" text-anchor="middle" class="tiny">Readers announce snapshot age; writers decide reclamation. A compact copy is required to produce a smaller file.</text>
</svg>
