<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LMDB architecture overview</title>
  <desc id="desc">Applications use LMDB transactions and B plus trees. Reads follow a lock-free snapshot through the read-only memory map, while one serialized writer creates copy-on-write pages and publishes a new meta page. data.mdb stores metadata and database pages; lock.mdb stores synchronization state and reader slots.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#101a31"/>
    </linearGradient>
    <linearGradient id="library" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12233a"/>
      <stop offset="1" stop-color="#0e1b30"/>
    </linearGradient>
    <linearGradient id="readGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="writeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000814" flood-opacity="0.38"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#7dd3fc" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="arrowRead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowWrite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowNeutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans Thai", "Segoe UI", Arial, sans-serif; }
      .title { font-size: 44px; font-weight: 800; letter-spacing: 1.5px; fill: #f8fafc; }
      .subtitle { font-size: 20px; font-weight: 450; fill: #9fb1c8; }
      .layer { font-size: 14px; font-weight: 800; letter-spacing: 2.2px; fill: #6f849f; }
      .section { font-size: 24px; font-weight: 800; fill: #f1f5f9; }
      .boxTitle { font-size: 22px; font-weight: 750; fill: #edf6ff; }
      .boxSub { font-size: 17px; font-weight: 450; fill: #a9bbcf; }
      .chip { font-size: 16px; font-weight: 700; fill: #d9e8f8; }
      .laneTitle { font-size: 16px; font-weight: 850; letter-spacing: 1.8px; }
      .step { font-size: 18px; font-weight: 720; fill: #edf6ff; }
      .stepSub { font-size: 14px; font-weight: 450; fill: #a7bacf; }
      .tiny { font-size: 14px; font-weight: 600; fill: #91a6bd; }
      .fileTitle { font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .fileSub { font-size: 15px; font-weight: 520; fill: #aabbd0; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1460" cy="110" r="170" fill="#0ea5e9" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="120" cy="850" r="180" fill="#8b5cf6" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Header -->
  <g transform="translate(82,58)">
    <rect x="0" y="4" width="9" height="58" rx="4.5" fill="#38bdf8"/>
    <text x="28" y="42" class="title">LMDB ARCHITECTURE</text>
    <text x="29" y="74" class="subtitle">Memory-mapped B+ trees • MVCC snapshots • copy-on-write commits</text>
  </g>
  <g transform="translate(1165,57)">
    <rect width="350" height="42" rx="21" fill="#0f2238" stroke="#24415e"/>
    <circle cx="24" cy="21" r="6" fill="#34d399"/>
    <text x="42" y="27" class="tiny" fill="#b9c8da">ACID · ZERO-COPY READS · NO WAL</text>
  </g>

  <!-- Layer 01: Application -->
  <text x="82" y="159" class="layer">01  CLIENT</text>
  <g filter="url(#shadow)">
    <rect x="182" y="125" width="1336" height="102" rx="18" fill="#102036" stroke="#29415c" stroke-width="1.5"/>
    <g transform="translate(220,151)">
      <rect width="52" height="52" rx="14" fill="#102e48" stroke="#25658c"/>
      <path d="M14 18h24M14 26h24M14 34h15" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="298" y="164" class="boxTitle">APPLICATION PROCESSES &amp; THREADS</text>
    <text x="298" y="194" class="boxSub">Open an environment, begin a transaction, then read, write, or scan with a cursor.</text>
    <g transform="translate(1080,151)">
      <rect width="112" height="42" rx="12" fill="#132a42" stroke="#2b4a68"/>
      <text x="56" y="27" text-anchor="middle" class="chip">mdb_get</text>
      <rect x="126" width="112" height="42" rx="12" fill="#132a42" stroke="#2b4a68"/>
      <text x="182" y="27" text-anchor="middle" class="chip">mdb_put</text>
      <rect x="252" width="136" height="42" rx="12" fill="#132a42" stroke="#2b4a68"/>
      <text x="320" y="27" text-anchor="middle" class="chip">MDB_cursor</text>
    </g>
  </g>
  <path d="M800 228 V264" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowNeutral)"/>

  <!-- Layer 02: LMDB library -->
  <text x="82" y="312" class="layer">02  ENGINE</text>
  <g filter="url(#shadow)">
    <rect x="122" y="270" width="1396" height="392" rx="24" fill="url(#library)" stroke="#314b69" stroke-width="1.5"/>
  </g>
  <text x="195" y="318" class="section">LMDB LIBRARY <tspan fill="#7f96b0" font-size="17">(C API)</tspan></text>

  <!-- Handle / data structure strip -->
  <g transform="translate(170,342)">
    <rect width="1240" height="72" rx="15" fill="#0c192b" stroke="#263d58"/>
    <g transform="translate(20,15)">
      <rect width="182" height="42" rx="11" fill="#172a43" stroke="#34506e"/>
      <text x="91" y="27" text-anchor="middle" class="chip">MDB_env</text>
      <rect x="198" width="182" height="42" rx="11" fill="#172a43" stroke="#34506e"/>
      <text x="289" y="27" text-anchor="middle" class="chip">MDB_txn</text>
      <rect x="396" width="182" height="42" rx="11" fill="#172a43" stroke="#34506e"/>
      <text x="487" y="27" text-anchor="middle" class="chip">MDB_cursor</text>
      <path d="M596 21 H646" stroke="#64748b" stroke-width="2" marker-end="url(#arrowNeutral)"/>
      <rect x="664" width="258" height="42" rx="11" fill="#173249" stroke="#277194"/>
      <text x="793" y="27" text-anchor="middle" class="chip">Main / named B+ trees</text>
      <rect x="938" width="262" height="42" rx="11" fill="#18352f" stroke="#2d806a"/>
      <text x="1069" y="27" text-anchor="middle" class="chip">FreeDB B+ tree · page IDs</text>
    </g>
  </g>

  <!-- Read lane -->
  <g transform="translate(170,438)">
    <rect width="592" height="178" rx="18" fill="url(#readGlow)" stroke="#1e7099" stroke-width="1.4"/>
    <rect x="18" y="17" width="110" height="30" rx="15" fill="#0c4a6e"/>
    <text x="73" y="38" text-anchor="middle" class="laneTitle" fill="#7dd3fc">READ PATH</text>
    <text x="146" y="38" class="tiny">many concurrent readers</text>

    <g transform="translate(20,64)">
      <rect width="160" height="70" rx="13" fill="#10243a" stroke="#286382"/>
      <text x="80" y="28" text-anchor="middle" class="step">Snapshot</text>
      <text x="80" y="51" text-anchor="middle" class="stepSub">stable txnid</text>
      <path d="M168 35 H202" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowRead)"/>
      <rect x="212" width="160" height="70" rx="13" fill="#10243a" stroke="#286382"/>
      <text x="292" y="28" text-anchor="middle" class="step">B+ tree</text>
      <text x="292" y="51" text-anchor="middle" class="stepSub">page traversal</text>
      <path d="M380 35 H414" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowRead)"/>
      <rect x="424" width="128" height="70" rx="13" fill="#10243a" stroke="#286382"/>
      <text x="488" y="28" text-anchor="middle" class="step">Pointer</text>
      <text x="488" y="51" text-anchor="middle" class="stepSub">into mmap</text>
    </g>
    <text x="296" y="159" text-anchor="middle" class="tiny" fill="#72d5f7">lock-free snapshot · values commonly point directly into mapped pages</text>
  </g>

  <!-- Write lane -->
  <g transform="translate(826,438)">
    <rect width="592" height="178" rx="18" fill="url(#writeGlow)" stroke="#9a6421" stroke-width="1.4"/>
    <rect x="18" y="17" width="118" height="30" rx="15" fill="#713f12"/>
    <text x="77" y="38" text-anchor="middle" class="laneTitle" fill="#fcd34d">WRITE PATH</text>
    <text x="154" y="38" class="tiny">one active writer</text>

    <g transform="translate(20,64)">
      <rect width="154" height="70" rx="13" fill="#252033" stroke="#815a32"/>
      <text x="77" y="28" text-anchor="middle" class="step">Serialize</text>
      <text x="77" y="51" text-anchor="middle" class="stepSub">writer mutex</text>
      <path d="M162 35 H194" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowWrite)"/>
      <rect x="204" width="154" height="70" rx="13" fill="#252033" stroke="#815a32"/>
      <text x="281" y="28" text-anchor="middle" class="step">Copy-on-write</text>
      <text x="281" y="51" text-anchor="middle" class="stepSub">new dirty pages</text>
      <path d="M366 35 H398" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowWrite)"/>
      <rect x="408" width="144" height="70" rx="13" fill="#252033" stroke="#815a32"/>
      <text x="480" y="28" text-anchor="middle" class="step">Commit</text>
      <text x="480" y="51" text-anchor="middle" class="stepSub">publish meta</text>
    </g>
    <text x="296" y="159" text-anchor="middle" class="tiny" fill="#f3bf68">old pages stay valid until older reader snapshots finish</text>
  </g>

  <!-- Paths into OS layer -->
  <path d="M466 617 V693" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowRead)"/>
  <text x="482" y="682" class="tiny" fill="#74d8fb">mapped reads</text>
  <path d="M1122 617 V693" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrowWrite)"/>
  <text x="1138" y="682" class="tiny" fill="#f6c46e">flush + publish</text>

  <!-- Layer 03: OS virtual memory -->
  <text x="82" y="735" class="layer">03  MEMORY</text>
  <g filter="url(#shadow)">
    <rect x="122" y="704" width="1396" height="116" rx="20" fill="#0d1b2e" stroke="#334a64" stroke-width="1.5"/>
  </g>
  <g transform="translate(168,728)">
    <rect width="62" height="62" rx="16" fill="#182b45" stroke="#3c5977"/>
    <path d="M16 20h30M16 31h30M16 42h30" stroke="#b5c7db" stroke-width="3" stroke-linecap="round"/>
    <text x="86" y="25" class="boxTitle">OS VIRTUAL MEMORY + PAGE CACHE</text>
    <text x="86" y="52" class="boxSub">Demand paging decides what is resident; LMDB has no separate block cache.</text>
  </g>
  <g transform="translate(1010,728)">
    <rect width="456" height="62" rx="14" fill="#121f32" stroke="#2a405a"/>
    <text x="22" y="25" class="tiny" fill="#b9cadb">DEFAULT</text>
    <text x="100" y="25" class="boxSub" fill="#d7e4f2">data map is read-only</text>
    <text x="22" y="49" class="tiny" fill="#f3ba63">MDB_WRITEMAP</text>
    <text x="142" y="49" class="boxSub" fill="#d7e4f2">opts into a writable map</text>
  </g>

  <!-- Files -->
  <text x="82" y="888" class="layer">04  FILES</text>
  <path d="M704 821 V855" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowNeutral)"/>
  <path d="M1390 662 H1490 V856" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrowNeutral)"/>
  <text x="1468" y="846" text-anchor="end" class="tiny" fill="#b8a7f4">coordination</text>

  <g filter="url(#shadow)">
    <rect x="182" y="858" width="838" height="94" rx="18" fill="#10243a" stroke="#34759b" stroke-width="1.5"/>
    <rect x="204" y="878" width="80" height="54" rx="10" fill="#0c4a6e"/>
    <path d="M218 890h52M218 900h52M218 910h52M218 920h38" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <text x="308" y="894" class="fileTitle">data.mdb</text>
    <text x="308" y="922" class="fileSub">Meta 0 · Meta 1 · mixed branch, leaf, overflow, FreeDB and reusable pages</text>
    <rect x="850" y="880" width="136" height="48" rx="12" fill="#112f46" stroke="#2b769d"/>
    <text x="918" y="900" text-anchor="middle" class="tiny" fill="#8edcf7">persistent</text>
    <text x="918" y="920" text-anchor="middle" class="tiny">database</text>

    <rect x="1056" y="858" width="462" height="94" rx="18" fill="#1b1c37" stroke="#6d5aaa" stroke-width="1.5"/>
    <rect x="1078" y="878" width="80" height="54" rx="10" fill="#352b64"/>
    <circle cx="1102" cy="905" r="7" fill="#c4b5fd"/>
    <circle cx="1122" cy="905" r="7" fill="#a78bfa"/>
    <circle cx="1142" cy="905" r="7" fill="#8b5cf6"/>
    <text x="1182" y="894" class="fileTitle">lock.mdb</text>
    <text x="1182" y="922" class="fileSub">reader slots + shared synchronization state</text>
  </g>

  <text x="800" y="985" text-anchor="middle" class="tiny" fill="#6f849f">Read path and write path share the same B+ tree pages, but observe different MVCC snapshots.</text>
</svg>
