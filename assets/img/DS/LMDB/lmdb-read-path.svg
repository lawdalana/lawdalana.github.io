<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LMDB read transaction workflow</title>
  <desc id="desc">A read transaction claims a reader slot, captures a stable transaction ID and root, traverses branch pages to a leaf through the memory map, and returns found or not found. Resident pages are accessed directly; nonresident pages trigger an operating system page fault. C pointers and Python buffers remain valid only for the transaction lifetime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0a1629"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12283f"/><stop offset="1" stop-color="#0e1c31"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c4a6e"/><stop offset="1" stop-color="#12334d"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity="0.045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.42"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#38bdf8"/></marker>
    <marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#94a3b8"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans Thai","Segoe UI",Arial,sans-serif}.title{font-size:44px;font-weight:800;letter-spacing:1.4px;fill:#f8fafc}.subtitle{font-size:20px;fill:#9fb1c8}.eyebrow{font-size:14px;font-weight:850;letter-spacing:2px;fill:#71869f}.num{font-size:17px;font-weight:850;fill:#7dd3fc}.cardTitle{font-size:23px;font-weight:800;fill:#f2f8ff}.cardSub{font-size:16px;fill:#adbed1}.label{font-size:17px;font-weight:750;fill:#e5f3ff}.small{font-size:14px;font-weight:550;fill:#9fb2c8}.tiny{font-size:13px;font-weight:650;fill:#91a6bd}.lane{font-size:19px;font-weight:800;fill:#edf6ff}.code{font-size:15px;font-weight:700;fill:#bae6fd;font-family:"SFMono-Regular",Consolas,monospace}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1460" cy="100" r="180" fill="#0ea5e9" opacity=".07" filter="url(#glow)"/><circle cx="110" cy="900" r="190" fill="#8b5cf6" opacity=".05" filter="url(#glow)"/>

  <g transform="translate(82 58)"><rect y="4" width="9" height="58" rx="4.5" fill="#38bdf8"/><text x="28" y="42" class="title">LMDB READ PATH</text><text x="29" y="74" class="subtitle">Stable MVCC snapshot → mapped B+ tree pages → result with transaction lifetime</text></g>
  <g transform="translate(1204 57)"><rect width="312" height="44" rx="22" fill="#0e2940" stroke="#285572"/><circle cx="24" cy="22" r="6" fill="#34d399"/><text x="43" y="28" class="small" fill="#cceafe">MANY CONCURRENT READERS</text></g>

  <text x="82" y="157" class="eyebrow">READ TRANSACTION WORKFLOW</text>
  <g filter="url(#shadow)">
    <g transform="translate(82 180)"><rect width="320" height="188" rx="22" fill="url(#card)" stroke="#2b5877" stroke-width="1.5"/><rect x="22" y="22" width="42" height="42" rx="12" fill="#0c4a6e"/><text x="43" y="49" text-anchor="middle" class="num">01</text><text x="22" y="98" class="cardTitle">Begin read transaction</text><text x="22" y="130" class="cardSub">Claim a reader slot</text><text x="22" y="155" class="cardSub">and record active txnid</text></g>
    <g transform="translate(454 180)"><rect width="320" height="188" rx="22" fill="url(#card)" stroke="#2b5877" stroke-width="1.5"/><rect x="22" y="22" width="42" height="42" rx="12" fill="#0c4a6e"/><text x="43" y="49" text-anchor="middle" class="num">02</text><text x="22" y="98" class="cardTitle">Capture snapshot root</text><text x="22" y="130" class="cardSub">Choose valid committed meta</text><text x="22" y="155" class="cardSub">Root stays stable for this txn</text></g>
    <g transform="translate(826 180)"><rect width="320" height="188" rx="22" fill="url(#card)" stroke="#2b5877" stroke-width="1.5"/><rect x="22" y="22" width="42" height="42" rx="12" fill="#0c4a6e"/><text x="43" y="49" text-anchor="middle" class="num">03</text><text x="22" y="98" class="cardTitle">Traverse the B+ tree</text><text x="22" y="130" class="cardSub">Binary search branch nodes</text><text x="22" y="155" class="cardSub">Follow page numbers to a leaf</text></g>
    <g transform="translate(1198 180)"><rect width="320" height="188" rx="22" fill="url(#card)" stroke="#2b5877" stroke-width="1.5"/><rect x="22" y="22" width="42" height="42" rx="12" fill="#0c4a6e"/><text x="43" y="49" text-anchor="middle" class="num">04</text><text x="22" y="98" class="cardTitle">Return the result</text><text x="22" y="130" class="cardSub">Found: value in leaf/overflow</text><text x="22" y="155" class="cardSub">Missing: search ends at leaf</text></g>
  </g>
  <path d="M402 274H444" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M774 274H816" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1146 274H1188" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="82" y="425" class="eyebrow">ONE LOGICAL TREE PATH THROUGH THE MEMORY MAP</text>
  <g transform="translate(82 447)" filter="url(#shadow)">
    <rect width="1436" height="194" rx="22" fill="#0c192c" stroke="#2d4d68" stroke-width="1.5"/>
    <g transform="translate(42 38)"><rect width="198" height="112" rx="16" fill="#17324b" stroke="#3b82a9"/><text x="99" y="38" text-anchor="middle" class="label">META SNAPSHOT</text><text x="99" y="68" text-anchor="middle" class="code">txnid = 43</text><text x="99" y="94" text-anchor="middle" class="small">root page R43</text></g>
    <path d="M252 94H338" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(350 38)"><rect width="198" height="112" rx="16" fill="#164e75" stroke="#60a5fa"/><text x="99" y="38" text-anchor="middle" class="label">ROOT / BRANCH</text><text x="99" y="68" text-anchor="middle" class="small">separator keys</text><text x="99" y="94" text-anchor="middle" class="small">child page IDs</text></g>
    <path d="M560 94H646" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(658 38)"><rect width="198" height="112" rx="16" fill="#185f83" stroke="#67e8f9"/><text x="99" y="38" text-anchor="middle" class="label">BRANCH</text><text x="99" y="68" text-anchor="middle" class="small">narrow the key range</text><text x="99" y="94" text-anchor="middle" class="small">follow one child</text></g>
    <path d="M868 94H954" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(966 38)"><rect width="198" height="112" rx="16" fill="#0e7490" stroke="#67e8f9"/><text x="99" y="38" text-anchor="middle" class="label">LEAF</text><text x="99" y="68" text-anchor="middle" class="small">ordered key records</text><text x="99" y="94" text-anchor="middle" class="small">value or overflow ID</text></g>
    <path d="M1176 94H1262" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(1274 38)"><rect width="120" height="112" rx="16" fill="#123c3a" stroke="#34d399"/><text x="60" y="43" text-anchor="middle" class="label">VALUE</text><text x="60" y="72" text-anchor="middle" class="small">or</text><text x="60" y="96" text-anchor="middle" class="small">NOT FOUND</text></g>
  </g>

  <text x="82" y="697" class="eyebrow">WHAT HAPPENS WHEN A MAPPED PAGE IS TOUCHED?</text>
  <g transform="translate(82 720)" filter="url(#shadow)">
    <rect width="696" height="164" rx="20" fill="#102b35" stroke="#2b786f" stroke-width="1.5"/><circle cx="45" cy="47" r="14" fill="#34d399"/><text x="78" y="43" class="lane">PAGE IS RESIDENT</text><text x="78" y="72" class="small">CPU reads the mapped bytes; no database block-cache lookup.</text><rect x="30" y="101" width="636" height="38" rx="12" fill="#102e35" stroke="#255d59"/><text x="348" y="126" text-anchor="middle" class="code">mapped address → resident physical page</text>
  </g>
  <g transform="translate(822 720)" filter="url(#shadow)">
    <rect width="696" height="164" rx="20" fill="#30241d" stroke="#98682f" stroke-width="1.5"/><circle cx="45" cy="47" r="14" fill="#f59e0b"/><text x="78" y="43" class="lane">PAGE IS NOT RESIDENT</text><text x="78" y="72" class="small">OS page fault → storage read → page becomes resident → instruction resumes.</text><g transform="translate(30 101)"><rect width="168" height="38" rx="12" fill="#33281f" stroke="#805b31"/><text x="84" y="25" text-anchor="middle" class="tiny">PAGE FAULT</text><path d="M177 19H221" stroke="#94a3b8" stroke-width="2" marker-end="url(#neutral)"/><rect x="231" width="168" height="38" rx="12" fill="#33281f" stroke="#805b31"/><text x="315" y="25" text-anchor="middle" class="tiny">OS LOADS PAGE</text><path d="M408 19H452" stroke="#94a3b8" stroke-width="2" marker-end="url(#neutral)"/><rect x="462" width="174" height="38" rx="12" fill="#243127" stroke="#3e7a54"/><text x="549" y="25" text-anchor="middle" class="tiny">READ CONTINUES</text></g>
  </g>

  <g transform="translate(82 914)"><rect width="1436" height="54" rx="16" fill="#171f35" stroke="#4b4b74"/><text x="26" y="34" class="small" fill="#c5d2e1">LIFETIME RULE</text><text x="170" y="34" class="small" fill="#edf6ff">C MDB_val pointers and py-lmdb buffers=True views must not outlive the transaction. Python txn.get() returns bytes by default.</text></g>
  <text x="800" y="991" text-anchor="middle" class="tiny">The OS decides residency; LMDB supplies the stable tree snapshot and mapped address translation.</text>
</svg>
