<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LMDB transaction lifecycle</title>
  <desc id="desc">An application opens one environment and begins either a read-only or write transaction. Read-only transactions claim a reader slot, capture a snapshot, read or scan, and release the slot. A write transaction waits for the single writer lock, performs copy-on-write changes, then commits or aborts. Transactions, cursors, pointers and buffers have explicit lifetimes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0a1629"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <linearGradient id="read" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3c59"/><stop offset="1" stop-color="#10273e"/></linearGradient>
    <linearGradient id="write" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b301b"/><stop offset="1" stop-color="#261f2d"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity=".42"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#38bdf8"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#f59e0b"/></marker>
    <marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#94a3b8"/></marker>
    <style>text{font-family:Inter,"Noto Sans Thai","Segoe UI",Arial,sans-serif}.title{font-size:44px;font-weight:800;letter-spacing:1.4px;fill:#f8fafc}.subtitle{font-size:20px;fill:#9fb1c8}.eyebrow{font-size:14px;font-weight:850;letter-spacing:2px;fill:#71869f}.nodeTitle{font-size:21px;font-weight:800;fill:#f2f8ff}.nodeSub{font-size:15px;fill:#adbed1}.laneTitle{font-size:24px;font-weight:850;letter-spacing:1px}.label{font-size:17px;font-weight:750;fill:#e5f3ff}.small{font-size:14px;font-weight:550;fill:#9fb2c8}.tiny{font-size:13px;font-weight:650;fill:#91a6bd}.rule{font-size:16px;font-weight:650;fill:#dce8f5}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/><circle cx="1450" cy="100" r="180" fill="#f59e0b" opacity=".055" filter="url(#glow)"/><circle cx="100" cy="900" r="190" fill="#0ea5e9" opacity=".055" filter="url(#glow)"/>
  <g transform="translate(82 58)"><rect y="4" width="9" height="58" rx="4.5" fill="#a78bfa"/><text x="28" y="42" class="title">LMDB TRANSACTION LIFECYCLE</text><text x="29" y="74" class="subtitle">Every operation is transactional • many readers • one active writer</text></g>
  <g transform="translate(1225 57)"><rect width="292" height="44" rx="22" fill="#211d3c" stroke="#5d50a0"/><circle cx="24" cy="22" r="6" fill="#a78bfa"/><text x="43" y="28" class="small" fill="#ddd6fe">LIFETIMES ARE EXPLICIT</text></g>

  <text x="82" y="157" class="eyebrow">COMMON ENTRY</text>
  <g transform="translate(82 180)" filter="url(#shadow)"><rect width="420" height="122" rx="20" fill="#111f34" stroke="#39536e" stroke-width="1.5"/><rect x="22" y="24" width="74" height="74" rx="17" fill="#1b304b" stroke="#486784"/><path d="M40 45h38M40 60h38M40 75h28" stroke="#c5d7e8" stroke-width="4" stroke-linecap="round"/><text x="120" y="53" class="nodeTitle">Open MDB_env</text><text x="120" y="81" class="nodeSub">Map data file + open shared lock state</text></g>
  <path d="M502 241H595" stroke="#94a3b8" stroke-width="3" marker-end="url(#neutral)"/>
  <g transform="translate(610 180)" filter="url(#shadow)"><rect width="380" height="122" rx="20" fill="#111f34" stroke="#39536e" stroke-width="1.5"/><circle cx="65" cy="61" r="35" fill="#202e48" stroke="#64748b"/><path d="M52 61h26M65 48v26" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><text x="122" y="53" class="nodeTitle">Begin transaction</text><text x="122" y="81" class="nodeSub">Choose read-only or write</text></g>
  <path d="M990 241H1083" stroke="#94a3b8" stroke-width="3" marker-end="url(#neutral)"/>
  <g transform="translate(1098 180)" filter="url(#shadow)"><rect width="420" height="122" rx="20" fill="#111f34" stroke="#39536e" stroke-width="1.5"/><text x="24" y="48" class="nodeTitle">Open/reuse DB handles</text><text x="24" y="78" class="nodeSub">Main DB or named DB; cursors belong to txn</text><rect x="316" y="30" width="76" height="62" rx="14" fill="#1b304b" stroke="#486784"/><text x="354" y="69" text-anchor="middle" class="label">DBI</text></g>

  <path d="M800 303V348" stroke="#94a3b8" stroke-width="3"/><path d="M800 348H417V386" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#blue)"/><path d="M800 348H1183V386" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#orange)"/>

  <g transform="translate(82 392)" filter="url(#shadow)"><rect width="690" height="438" rx="24" fill="url(#read)" stroke="#27749a" stroke-width="1.6"/><rect x="24" y="22" width="170" height="40" rx="20" fill="#0c4a6e"/><text x="109" y="49" text-anchor="middle" class="laneTitle" fill="#7dd3fc">READ-ONLY</text><text x="215" y="49" class="small">many can be active</text>
    <g transform="translate(28 91)"><rect width="182" height="106" rx="16" fill="#10283f" stroke="#34789c"/><text x="91" y="36" text-anchor="middle" class="label">Claim reader slot</text><text x="91" y="65" text-anchor="middle" class="nodeSub">PID/thread + txnid</text><text x="91" y="88" text-anchor="middle" class="tiny">lock.mdb</text><path d="M194 53H232" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="244" width="182" height="106" rx="16" fill="#10283f" stroke="#34789c"/><text x="335" y="36" text-anchor="middle" class="label">Stable snapshot</text><text x="335" y="65" text-anchor="middle" class="nodeSub">meta + root</text><text x="335" y="88" text-anchor="middle" class="tiny">no page read locks</text><path d="M438 53H476" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="488" width="146" height="106" rx="16" fill="#10283f" stroke="#34789c"/><text x="561" y="36" text-anchor="middle" class="label">Get / scan</text><text x="561" y="65" text-anchor="middle" class="nodeSub">cursor</text><text x="561" y="88" text-anchor="middle" class="tiny">mapped pages</text></g>
    <path d="M345 215V258" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#blue)"/><g transform="translate(124 270)"><rect width="442" height="88" rx="16" fill="#10283f" stroke="#34789c"/><text x="221" y="34" text-anchor="middle" class="label">End / reset transaction</text><text x="221" y="62" text-anchor="middle" class="nodeSub">Release or deactivate reader slot</text></g><text x="345" y="397" text-anchor="middle" class="small" fill="#a7e8fb">Old mapped pages may be reused only after this snapshot is no longer active.</text>
  </g>

  <g transform="translate(828 392)" filter="url(#shadow)"><rect width="690" height="438" rx="24" fill="url(#write)" stroke="#a46b29" stroke-width="1.6"/><rect x="24" y="22" width="170" height="40" rx="20" fill="#713f12"/><text x="109" y="49" text-anchor="middle" class="laneTitle" fill="#fcd34d">WRITE</text><text x="215" y="49" class="small">one active writer</text>
    <g transform="translate(28 91)"><rect width="182" height="106" rx="16" fill="#2d241f" stroke="#9b682f"/><text x="91" y="36" text-anchor="middle" class="label">Wait for lock</text><text x="91" y="65" text-anchor="middle" class="nodeSub">serialize writers</text><text x="91" y="88" text-anchor="middle" class="tiny">writer mutex</text><path d="M194 53H232" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#orange)"/><rect x="244" width="182" height="106" rx="16" fill="#2d241f" stroke="#9b682f"/><text x="335" y="36" text-anchor="middle" class="label">Put / delete</text><text x="335" y="65" text-anchor="middle" class="nodeSub">dirty COW pages</text><text x="335" y="88" text-anchor="middle" class="tiny">latest snapshot</text><path d="M438 53H476" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#orange)"/><rect x="488" width="146" height="106" rx="16" fill="#2d241f" stroke="#9b682f"/><text x="561" y="36" text-anchor="middle" class="label">Decide</text><text x="561" y="65" text-anchor="middle" class="nodeSub">commit</text><text x="561" y="88" text-anchor="middle" class="tiny">or abort</text></g>
    <path d="M345 215V251" stroke="#f59e0b" stroke-width="2.5"/><path d="M345 251H190V274" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#neutral)"/><path d="M345 251H500V274" fill="none" stroke="#fb7185" stroke-width="2.5" marker-end="url(#neutral)"/><g transform="translate(62 282)"><rect width="256" height="82" rx="16" fill="#21342a" stroke="#3c8a5c"/><text x="128" y="32" text-anchor="middle" class="label">COMMIT</text><text x="128" y="59" text-anchor="middle" class="nodeSub">sync + publish meta</text></g><g transform="translate(372 282)"><rect width="256" height="82" rx="16" fill="#392329" stroke="#a84f62"/><text x="128" y="32" text-anchor="middle" class="label">ABORT</text><text x="128" y="59" text-anchor="middle" class="nodeSub">discard uncommitted view</text></g><text x="345" y="397" text-anchor="middle" class="small" fill="#f4c779">Both paths end the transaction and release the writer lock.</text>
  </g>

  <text x="82" y="881" class="eyebrow">LIFETIME &amp; THREADING RULES</text>
  <g transform="translate(82 902)"><rect width="1436" height="66" rx="17" fill="#171f35" stroke="#4b4b74"/><circle cx="31" cy="33" r="7" fill="#a78bfa"/><text x="52" y="27" class="rule">Do not use a cursor, mapped pointer, or buffer after its transaction ends.</text><text x="52" y="49" class="small">Do not use one transaction/cursor concurrently across threads; a write transaction stays on its creating thread.</text><rect x="1182" y="14" width="226" height="38" rx="12" fill="#221f3d" stroke="#5c50a0"/><text x="1295" y="39" text-anchor="middle" class="tiny" fill="#ddd6fe">KEEP READ TXNS SHORT</text></g>
  <text x="800" y="992" text-anchor="middle" class="tiny">The environment can stay open; transactions define visibility, consistency, and object lifetime.</text>
</svg>
