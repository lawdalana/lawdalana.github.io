<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">LMDB B plus tree workflow compared with RocksDB LSM workflow</title>
  <desc id="desc">LMDB uses one serialized write transaction, copy-on-write B plus tree pages, synchronization according to flags, alternating meta pages, memory-mapped reads, FreeDB page reuse, and optional compact copies. RocksDB typically writes to a WAL and memtable, flushes immutable memtables to SST files, compacts files in the background, and reads through memory structures, block cache, filters, indexes and relevant SST files. The diagram presents trade-offs rather than a universal winner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0a1629"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <linearGradient id="lmdb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e3048"/><stop offset="1" stop-color="#0e1d31"/></linearGradient>
    <linearGradient id="rocks" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30251d"/><stop offset="1" stop-color="#241e2c"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity=".42"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#38bdf8"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#f59e0b"/></marker>
    <marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#94a3b8"/></marker>
    <style>text{font-family:Inter,"Noto Sans Thai","Segoe UI",Arial,sans-serif}.title{font-size:44px;font-weight:800;letter-spacing:1.4px;fill:#f8fafc}.subtitle{font-size:20px;fill:#9fb1c8}.eyebrow{font-size:14px;font-weight:850;letter-spacing:2px;fill:#71869f}.engine{font-size:32px;font-weight:900;letter-spacing:1px}.engineSub{font-size:16px;fill:#aebfd1}.lane{font-size:18px;font-weight:850;letter-spacing:1px}.nodeTitle{font-size:16px;font-weight:800;fill:#f2f8ff}.nodeSub{font-size:13px;fill:#adbed1}.label{font-size:17px;font-weight:750;fill:#e5f3ff}.small{font-size:14px;font-weight:550;fill:#9fb2c8}.tiny{font-size:13px;font-weight:650;fill:#91a6bd}.callout{font-size:17px;font-weight:750;fill:#edf6ff}</style>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/><rect width="1600" height="1080" fill="url(#grid)"/><circle cx="1450" cy="100" r="180" fill="#f59e0b" opacity=".055" filter="url(#glow)"/><circle cx="100" cy="980" r="190" fill="#0ea5e9" opacity=".055" filter="url(#glow)"/>
  <g transform="translate(82 58)"><rect y="4" width="9" height="58" rx="4.5" fill="#a78bfa"/><text x="28" y="42" class="title">LMDB B+ TREE vs ROCKSDB LSM</text><text x="29" y="74" class="subtitle">Two storage workflows with different write, read, cache, and maintenance trade-offs</text></g>
  <g transform="translate(1192 57)"><rect width="325" height="44" rx="22" fill="#211f3b" stroke="#5d50a0"/><circle cx="24" cy="22" r="6" fill="#a78bfa"/><text x="43" y="28" class="small" fill="#ddd6fe">BENCHMARK YOUR WORKLOAD</text></g>

  <text x="82" y="157" class="eyebrow">CONCEPTUAL DATA FLOW</text>
  <g transform="translate(82 180)" filter="url(#shadow)">
    <rect width="700" height="716" rx="26" fill="url(#lmdb)" stroke="#2e759b" stroke-width="1.7"/>
    <rect x="24" y="22" width="652" height="82" rx="18" fill="#102c42" stroke="#2d6a8d"/><text x="26" y="50" class="engine" fill="#7dd3fc">LMDB</text><text x="26" y="78" class="engineSub">mmap + MVCC + copy-on-write B+ tree</text><rect x="486" y="23" width="166" height="36" rx="18" fill="#0c4a6e"/><text x="569" y="47" text-anchor="middle" class="tiny" fill="#bae6fd">ONE ACTIVE WRITER</text>

    <text x="28" y="145" class="lane" fill="#fcd34d">WRITE / COMMIT</text>
    <g transform="translate(28 164)"><rect width="142" height="86" rx="15" fill="#2e261f" stroke="#8a6032"/><text x="71" y="34" text-anchor="middle" class="nodeTitle">Write txn</text><text x="71" y="58" text-anchor="middle" class="nodeSub">writer lock</text><text x="71" y="76" text-anchor="middle" class="nodeSub">put / delete</text><path d="M150 43H176" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#orange)"/><rect x="186" width="142" height="86" rx="15" fill="#2e261f" stroke="#8a6032"/><text x="257" y="34" text-anchor="middle" class="nodeTitle">COW pages</text><text x="257" y="58" text-anchor="middle" class="nodeSub">leaf + ancestors</text><text x="257" y="76" text-anchor="middle" class="nodeSub">split if needed</text><path d="M336 43H362" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#orange)"/><rect x="372" width="142" height="86" rx="15" fill="#2e261f" stroke="#8a6032"/><text x="443" y="34" text-anchor="middle" class="nodeTitle">Sync policy</text><text x="443" y="58" text-anchor="middle" class="nodeSub">default or flags</text><text x="443" y="76" text-anchor="middle" class="nodeSub">changes guarantee</text><path d="M522 43H548" stroke="#34d399" stroke-width="2.5" marker-end="url(#neutral)"/><rect x="558" width="86" height="86" rx="15" fill="#1c392f" stroke="#3e8b64"/><text x="601" y="34" text-anchor="middle" class="nodeTitle">Meta</text><text x="601" y="58" text-anchor="middle" class="nodeSub">publish</text><text x="601" y="76" text-anchor="middle" class="nodeSub">new root</text></g>

    <text x="28" y="301" class="lane" fill="#7dd3fc">READ</text>
    <g transform="translate(28 320)"><rect width="142" height="86" rx="15" fill="#102d44" stroke="#34799e"/><text x="71" y="34" text-anchor="middle" class="nodeTitle">Read txn</text><text x="71" y="58" text-anchor="middle" class="nodeSub">stable root</text><text x="71" y="76" text-anchor="middle" class="nodeSub">reader slot</text><path d="M150 43H184" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="194" width="208" height="86" rx="15" fill="#102d44" stroke="#34799e"/><text x="298" y="34" text-anchor="middle" class="nodeTitle">One B+ tree path</text><text x="298" y="58" text-anchor="middle" class="nodeSub">branch → leaf → overflow</text><text x="298" y="76" text-anchor="middle" class="nodeSub">ordered cursor scan</text><path d="M410 43H444" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="454" width="190" height="86" rx="15" fill="#102d44" stroke="#34799e"/><text x="549" y="34" text-anchor="middle" class="nodeTitle">OS page cache</text><text x="549" y="58" text-anchor="middle" class="nodeSub">mapped page resident</text><text x="549" y="76" text-anchor="middle" class="nodeSub">or page fault</text></g>

    <text x="28" y="457" class="lane" fill="#a7f3d0">SPACE / MAINTENANCE</text>
    <g transform="translate(28 476)"><rect width="298" height="94" rx="16" fill="#16342f" stroke="#3c8065"/><text x="20" y="34" class="nodeTitle">FreeDB page reuse</text><text x="20" y="60" class="nodeSub">Oldest reader gates safe reuse.</text><text x="20" y="80" class="nodeSub">Deletes do not shrink data.mdb.</text><rect x="346" width="298" height="94" rx="16" fill="#192d37" stroke="#3a6575"/><text x="366" y="34" class="nodeTitle">Optional compact copy</text><text x="366" y="60" class="nodeSub">mdb_copy -c omits free pages.</text><text x="366" y="80" class="nodeSub">No mandatory background compaction.</text></g>

    <rect x="28" y="607" width="644" height="80" rx="17" fill="#101f32" stroke="#314b64"/><circle cx="55" cy="647" r="8" fill="#38bdf8"/><text x="75" y="638" class="callout">Cost is concentrated in the foreground transaction.</text><text x="75" y="662" class="small">Writer serialization, COW, splits and commit sync shape latency.</text>
  </g>

  <g transform="translate(818 180)" filter="url(#shadow)">
    <rect width="700" height="716" rx="26" fill="url(#rocks)" stroke="#95642f" stroke-width="1.7"/>
    <rect x="24" y="22" width="652" height="82" rx="18" fill="#34271e" stroke="#82592f"/><text x="26" y="50" class="engine" fill="#fcd34d">ROCKSDB</text><text x="26" y="78" class="engineSub">WAL + memtables + sorted string table files</text><rect x="450" y="23" width="202" height="36" rx="18" fill="#713f12"/><text x="551" y="47" text-anchor="middle" class="tiny" fill="#fde68a">LSM BACKGROUND PIPELINE</text>

    <text x="28" y="145" class="lane" fill="#fcd34d">TYPICAL / DEFAULT WRITE PATH</text>
    <g transform="translate(28 164)"><rect width="132" height="86" rx="15" fill="#34281f" stroke="#8a6032"/><text x="66" y="34" text-anchor="middle" class="nodeTitle">Client write</text><text x="66" y="58" text-anchor="middle" class="nodeSub">batch / seqno</text><text x="66" y="76" text-anchor="middle" class="nodeSub">write options</text><path d="M140 43H162" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#orange)"/><rect x="172" width="132" height="86" rx="15" fill="#34281f" stroke="#8a6032"/><text x="238" y="34" text-anchor="middle" class="nodeTitle">WAL</text><text x="238" y="58" text-anchor="middle" class="nodeSub">normally append</text><text x="238" y="76" text-anchor="middle" class="nodeSub">can be configured</text><path d="M312 43H334" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#orange)"/><rect x="344" width="132" height="86" rx="15" fill="#34281f" stroke="#8a6032"/><text x="410" y="34" text-anchor="middle" class="nodeTitle">Memtable</text><text x="410" y="58" text-anchor="middle" class="nodeSub">mutable →</text><text x="410" y="76" text-anchor="middle" class="nodeSub">immutable</text><path d="M484 43H506" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#orange)"/><rect x="516" width="128" height="86" rx="15" fill="#34281f" stroke="#8a6032"/><text x="580" y="34" text-anchor="middle" class="nodeTitle">Flush</text><text x="580" y="58" text-anchor="middle" class="nodeSub">new SST</text><text x="580" y="76" text-anchor="middle" class="nodeSub">background</text></g>

    <text x="28" y="301" class="lane" fill="#a7c7f9">READ</text>
    <g transform="translate(28 320)"><rect width="132" height="86" rx="15" fill="#28283a" stroke="#66658a"/><text x="66" y="34" text-anchor="middle" class="nodeTitle">Get / iterator</text><text x="66" y="58" text-anchor="middle" class="nodeSub">snapshot seqno</text><text x="66" y="76" text-anchor="middle" class="nodeSub">merge visibility</text><path d="M140 43H166" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#neutral)"/><rect x="176" width="206" height="86" rx="15" fill="#28283a" stroke="#66658a"/><text x="279" y="34" text-anchor="middle" class="nodeTitle">Memory + block cache</text><text x="279" y="58" text-anchor="middle" class="nodeSub">memtables, cached blocks</text><text x="279" y="76" text-anchor="middle" class="nodeSub">index / filter blocks</text><path d="M390 43H416" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#neutral)"/><rect x="426" width="218" height="86" rx="15" fill="#28283a" stroke="#66658a"/><text x="535" y="34" text-anchor="middle" class="nodeTitle">Relevant SST files</text><text x="535" y="58" text-anchor="middle" class="nodeSub">Bloom/index narrows work</text><text x="535" y="76" text-anchor="middle" class="nodeSub">merge across sources</text></g>

    <text x="28" y="457" class="lane" fill="#f0ab8c">SPACE / MAINTENANCE</text>
    <g transform="translate(28 476)"><rect width="298" height="94" rx="16" fill="#3a2921" stroke="#8a5d35"/><text x="20" y="34" class="nodeTitle">Background compaction</text><text x="20" y="60" class="nodeSub">Merge/rewrite SST files and</text><text x="20" y="80" class="nodeSub">discard obsolete versions.</text><rect x="346" width="298" height="94" rx="16" fill="#3a2921" stroke="#8a5d35"/><text x="366" y="34" class="nodeTitle">Rate control / stalls</text><text x="366" y="60" class="nodeSub">Flush or compaction backlog can</text><text x="366" y="80" class="nodeSub">slow or stop incoming writes.</text></g>

    <rect x="28" y="607" width="644" height="80" rx="17" fill="#2d251f" stroke="#6e5031"/><circle cx="55" cy="647" r="8" fill="#f59e0b"/><text x="75" y="638" class="callout">Foreground and background work are decoupled.</text><text x="75" y="662" class="small">Cache, flush and compaction settings shape throughput and tails.</text>
  </g>

  <text x="82" y="947" class="eyebrow">HOW TO CHOOSE</text>
  <g transform="translate(82 970)"><rect width="1436" height="72" rx="18" fill="#171f35" stroke="#4b4b74"/><g transform="translate(25 17)"><rect width="400" height="38" rx="12" fill="#102c42" stroke="#2d6a8d"/><text x="200" y="25" text-anchor="middle" class="tiny" fill="#bae6fd">READ / SCAN + SIMPLE OPERATIONS → EVALUATE LMDB</text><rect x="438" width="434" height="38" rx="12" fill="#34271e" stroke="#82592f"/><text x="655" y="25" text-anchor="middle" class="tiny" fill="#fde68a">WRITE INGESTION + LSM FEATURES → EVALUATE ROCKSDB</text><rect x="910" width="476" height="38" rx="12" fill="#221f3d" stroke="#5c50a0"/><text x="1148" y="25" text-anchor="middle" class="tiny" fill="#ddd6fe">DECIDE WITH REAL DATA, SYNC MODE, RAM, DISK AND p99</text></g></g>
  <text x="800" y="1068" text-anchor="middle" class="tiny">This is an architectural comparison, not a universal performance ranking.</text>
</svg>
